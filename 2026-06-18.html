<style>
:root{--ink:#111827;--sub:#6b7280;--line:#e5e7eb;--bg:#fffdf7;--card:#fff;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);

.wrap{max-width:860px;margin:0 auto;padding:0 18px 120px}
header{position:sticky;top:0;background:rgba(255,253,247,.96);backdrop-filter:blur(6px);
       border-bottom:1px solid var(--line);z-index:20}
.hrow{max-width:860px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:10px}
.hrow .t{font-weight:800}

.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:#eef2ff;color:#3730a3}

.timer.rest{color:var(--amber);font-weight:700}
.step{display:flex;gap:6px;margin:12px 0 6px}
.step div{flex:1;text-align:center;font-size:12px;font-weight:700;padding:7px 0;
          border-radius:8px;background:#f3f4f6;color:#9ca3af}
.step div.on{background:var(--ink);color:#fff}
.step div.done{background:#dcfce7;color:var(--green)}
h1{font-size:20px;margin:16px 0 4px}
.sub{color:var(--sub);font-size:13px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.psg{font-size:18px;line-height:2.05;word-break:keep-all}
.w{cursor:pointer;border-radius:3px;padding:0 1px}
.w.unk{background:#fef3c7;box-shadow:inset 0 -2px 0 #f59e0b}
.w.look{background:#dbeafe}
.blank{display:inline-block;min-width:92px;border-bottom:2px solid var(--ink);vertical-align:-3px}
.mk{color:var(--blue);font-weight:800}
.mkl{color:var(--amber);font-weight:800}

     color:#fff;font:inherit;font-weight:800;cursor:pointer;margin:16px 0 0}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.35}
.pop{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);

.pop.on{transform:none}
.pop .e{font-size:21px;font-weight:800}
.pop .p{color:var(--blue);font-size:14px;margin:2px 0 6px}
.pop .k{font-size:17px}
.pop .x{position:absolute;right:16px;top:12px;border:0;background:none;font-size:22px;color:var(--sub)}
.say{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font-size:14px;cursor:pointer}
.sb{border-left:3px solid #d1d5db;padding:2px 0 2px 12px;margin:14px 0}
.sn{font-size:12px;color:var(--sub);font-weight:700}
.ck{display:inline-block;vertical-align:top;margin:0 10px 8px 0}

.lab{font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 5px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#e5e7eb;margin-right:4px}

th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}

.v1{background:#f0fdf4;color:var(--green)}
.v2{background:#fffbeb;color:var(--amber)}
.v3{background:#fef2f2;color:var(--red)}

<script>
function ghash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h*33)^s.charCodeAt(i))>>>0;}return h;}
var GKEY=445125949;
function gopen(){document.getElementById("gate").style.display="none";}
function gtry(){
  var v=document.getElementById("gpw").value;
  if(ghash(v)===GKEY){ try{localStorage.setItem("g_ok","1");}catch(e){} gopen(); }
  else document.getElementById("gmsg").textContent="비밀번호가 다릅니다";
}
document.getElementById("gpw").addEventListener("keydown",function(e){ if(e.key==="Enter") gtry(); });
try{ if(localStorage.getItem("g_ok")==="1") gopen(); }catch(e){}
</script>

var KEY = "go3read";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
var ST = load();
function rec(id){ if(!ST[id]) ST[id]={round:1,unk:[],a1:null,a2:null,trans:{},sum:"",cause:"",sec:0}; return ST[id]; }

/* ---------- 시계: 손이 멈추면 멈춘다 ---------- */
var cur=null, tick=null, idle=0;
function startClock(){
  stopClock();
  tick=setInterval(function(){
    idle++;
    if(idle<=60){ var r=rec(cur.id); r.sec++; save(ST); }
    var t=document.getElementById("timer"); if(!t) return;
    var s=rec(cur.id).sec, m=Math.floor(s/60);
    t.textContent=m+":"+String(s%60).padStart(2,"0");
    t.className="timer"+(idle>60?" rest":"");

  },1000);
}
function stopClock(){ if(tick){clearInterval(tick);tick=null;} }
["pointerdown","keydown","input"].forEach(function(ev){

function esc(t){ return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function markup(txt){
  var out="", re=/([A-Za-z][A-Za-z'’\-]*)|(_____)|([①②③④⑤])|(\([a-eA-D]\))|([\s\S])/g, m;
  while((m=re.exec(txt))){
    if(m[1]) out+='<span class="w" data-w="'+m[1].toLowerCase()+'">'+esc(m[1])+'</span>';
    else if(m[2]) out+='<span class="blank"></span>';
    else if(m[3]) out+='<span class="mk">'+m[3]+'</span>';
    else if(m[4]) out+='<span class="'+(/[A-D]/.test(m[4])?'sec':'mkl')+'">'+m[4]+'</span>';

}
function choices(d,r,sel,reveal,lock){
  if(!d.ch.length) return '<p class="sub">번호를 고르세요 (본문의 ①~⑤ 위치)</p>'+
    [1,2,3,4,5].map(function(n){
      var c="ch"+(sel===n?" sel":"")+(reveal?(n===d.ans?" ok":(sel===n?" no":"")):"");
      return '<button class="'+c+'" '+(lock?"disabled":"")+' onclick="pick('+n+')"><span class="n">'+CIRC[n-1]+'</span></button>';
    }).join("");
  return d.ch.map(function(t,i){
    var n=i+1, c="ch"+(sel===n?" sel":"")+(reveal?(n===d.ans?" ok":(sel===n?" no":"")):"");
    return '<button class="'+c+'" '+(lock?"disabled":"")+' onclick="pick('+n+')"><span class="n">'+CIRC[i]+'</span>'+esc(t)+'</button>';
  }).join("");
}

/* ---- 1차 : 사전 잠김 ---- */
function round1(d,r){
  return head(d)+
   '<div class="card"><div class="psg" id="psg">'+markup(d.psg)+'</div>'+
   (d.foot.length?'<p class="foot">'+d.foot.map(function(f){return "*"+esc(f.word)+": "+esc(f.gloss);}).join(" · ")+'</p>':'')+
   '</div>'+
   '<p class="sub">모르는 단어를 눌러 표시해 두세요. <b>뜻은 아직 안 뜹니다.</b> 시험장처럼 넘어가며 푸세요.</p>'+
   choices(d,r,r.a1,false,false)+
   '<button class="btn" id="go1" onclick="submit1()" '+(r.a1?"":"disabled")+'>1차 제출하고 2차로</button>';
}
function submit1(){ var r=rec(cur.id); if(!r.a1) return; r.round=2; save(ST); render(); window.scrollTo(0,0); }

/* ---- 2차 : 사전 열림 ---- */
function round2(d,r){
  var h=head(d)+
   '<div class="card"><div class="psg" id="psg">'+markup(d.psg)+'</div></div>'+
   '<p class="sub">이제 단어를 누르면 <b>뜻이 뜹니다.</b> 1차에 표시한 단어엔 색이 남아 있습니다.</p>'+
   '<div class="lab">문장별 해석 — 쓸 수 있는 만큼만 쓰세요</div>';
  d.sents.forEach(function(s,i){
    var en=s.ck.map(function(c){return c[0];}).join(" ");
    h+='<div class="sb"><div class="sn">'+(i+1)+'</div><div style="font-family:Georgia,serif">'+markup(en)+'</div>'+
       '<textarea data-i="'+i+'" placeholder="여기에 해석을 쓰세요 (S펜으로 써도 글자로 바뀝니다)">'+esc(r.trans[i]||"")+'</textarea></div>';
  });
  h+='<div class="lab">같은 문제를 다시 풀어 보세요 (1차 답은 잠겨 있습니다)</div>'+
     '<p class="sub">1차에 고른 답: <b>'+CIRC[r.a1-1]+'</b></p>'+
     choices(d,r,r.a2,false,false)+
     '<button class="btn" onclick="submit2()" '+(r.a2?"":"disabled")+'>2차 제출하고 정답 확인</button>';
  return h;
}
function submit2(){
  var r=rec(cur.id);
  document.querySelectorAll("textarea[data-i]").forEach(function(t){ r.trans[t.dataset.i]=t.value; });
  if(!r.a2) return;
  r.round=3; save(ST); render(); window.scrollTo(0,0);
}

/* ---- 3차 : 정답 확인 ---- */
function judge(sum,rub){
  var s=(sum||"").replace(/\s/g,"");
  return rub.map(function(row){
    return row[1].split("·").some(function(k){ k=k.trim().replace(/\s/g,""); return k && s.indexOf(k)>=0; });
  });
}
function round3(d,r){
  var ok1=r.a1===d.ans, ok2=r.a2===d.ans;
  var v = ok1&&ok2 ? ["v1","확실히 안다","난도를 올려도 됩니다."]
        : (!ok1&&ok2 ? ["v2","어휘 때문에 틀렸다","독해력 문제가 아닙니다. 단어장으로 해결됩니다."]
        : (ok1&&!ok2 ? ["v2","1차는 찍었을 가능성","실력으로 오해하면 안 되는 구간입니다."]
        : ["v3","독해·논리의 문제","단어를 외워도 안 오릅니다. 선생님과 함께 봐야 합니다."]));
  var hits=judge(r.sum,d.rub), n=hits.filter(Boolean).length;
  var h=head(d)+
   '<div class="verdict '+v[0]+'">1차 '+(ok1?"○":"✕")+' · 2차 '+(ok2?"○":"✕")+' → '+v[1]+'<br>'+
   '<span style="font-weight:400;font-size:14px">'+v[2]+'</span></div>'+
   '<div class="card"><div class="psg">'+markup(d.psg)+'</div></div>'+
   choices(d,r,r.a2,true,true)+
   '<div class="lab">줄거리 · 주제</div><div class="card">'+d.theme+'</div>'+
   (d.why?'<p class="sub">'+d.why+'</p>':'')+
   '<div class="lab">슬래시 해석</div>';
  d.sents.forEach(function(s,i){
    h+='<div class="sb"><div class="sn">'+(i+1)+'</div><div>'+
       s.ck.map(function(c){return '<span class="ck"><span class="en">'+esc(c[0])+'</span><span class="ko">'+
         (c===s.ck[0]?"":"/ ")+esc(c[1])+'</span></span>';}).join("")+
       '</div><div class="gl">'+s.g+'</div>'+
       (r.trans[i]?'<div class="sub" style="margin-top:6px">내가 쓴 해석 · '+esc(r.trans[i])+'</div>':'')+
       '</div>';
  });
  h+='<div class="lab">한 줄 요약 — 지문을 덮고 15~40자로</div>'+
     '<textarea id="sum" oninput="reJudge()" placeholder="이 글을 한 문장으로">'+esc(r.sum)+'</textarea>'+
     '<div id="sumres" style="margin:10px 0">'+sumRes(hits,d,r.sum)+'</div>'+
     '<div class="lab">틀렸다면 — 왜 틀렸나</div>'+
     ["단어를 몰라서","문장 구조를 못 풀어서","글의 흐름을 놓쳐서","선택지를 잘못 읽어서","시간이 모자라서","찍었다"]
       .map(function(c){ return '<button class="ch'+(r.cause===c?" sel":"")+'" onclick="setCause(\''+c+'\')">'+c+'</button>'; }).join("")+
     '<button class="btn" onclick="finish()">정리 끝내기</button>'+
     (MANY?'<button class="btn ghost" onclick="listView()">목록으로</button>':'');
  return h;
}
function sumRes(hits,d,sum){
  if(!sum) return '<p class="sub">요약을 쓰면 핵심 요소가 몇 개 담겼는지 바로 세어 줍니다.</p>';
  var miss=d.rub.filter(function(_,i){return !hits[i];}).map(function(r){return r[0];});
  return '<div>'+hits.map(function(x){return '<span class="dot'+(x?" on":"")+'"></span>';}).join("")+
    ' <b>핵심 '+hits.filter(Boolean).length+'/'+d.rub.length+'</b></div>'+
    '<table style="margin-top:8px"><tr><th>핵심 요소</th><th>담겼나</th></tr>'+
    d.rub.map(function(row,i){return '<tr><td>'+row[0]+'</td><td>'+(hits[i]?"○":"—")+'</td></tr>';}).join("")+
    '</table>'+(miss.length?'<p class="sub">빠진 것: '+miss.join(", ")+'</p>':'<p class="sub" style="color:#166534">다 담겼습니다.</p>');
}
function reJudge(){
  var r=rec(cur.id); r.sum=document.getElementById("sum").value; save(ST);
  document.getElementById("sumres").innerHTML=sumRes(judge(r.sum,cur.rub),cur,r.sum);
}
function setCause(c){ var r=rec(cur.id); r.cause=(r.cause===c?"":c); save(ST); render(); }
function finish(){ var r=rec(cur.id); r.round=4; save(ST); if(MANY) listView(); else render(); }

/* ---------- 단어 누르기 ---------- */
function pick(n){
  var r=rec(cur.id);
  if(r.round===1) r.a1=n; else if(r.round===2) r.a2=n; else return;
  save(ST); render();
}
function bindWords(){
  var r=cur?rec(cur.id):null; if(!r) return;
  document.querySelectorAll(".w").forEach(function(el){
    var w=el.dataset.w;
    if(r.unk.indexOf(w)>=0) el.classList.add(r.round===1?"unk":"look");
    el.onclick=function(){
      if(r.round===1){
        var i=r.unk.indexOf(w);
        if(i>=0){ r.unk.splice(i,1); } else { r.unk.push(w); }
        save(ST);
        document.querySelectorAll('.w[data-w="'+w+'"]').forEach(function(e2){ e2.classList.toggle("unk"); });
      }else{
        if(r.unk.indexOf(w)<0){ r.unk.push(w); save(ST); }
        showWord(w);
      }
    };
  });
  document.querySelectorAll("textarea[data-i]").forEach(function(t){
    t.onchange=function(){ rec(cur.id).trans[t.dataset.i]=t.value; save(ST); };
  });
}
function showWord(w){
  var e=cur.dic[w];
  document.getElementById("pe").textContent=w;
  document.getElementById("pp").textContent=e?(e.p||""):"";
  document.getElementById("pk").textContent=e?e.k:"이 지문 사전에 없는 단어입니다.";
  document.getElementById("psay").onclick=function(){ speak(w); };
  document.getElementById("pop").classList.add("on");
}
function closePop(){ document.getElementById("pop").classList.remove("on"); }

/* ---------- 시작 ---------- */
(function(){
  var h=location.hash.replace("#","");
  if(!MANY || (h && DATA.some(function(d){return d.id===h;}))) {
    cur = h ? DATA.filter(function(d){return d.id===h;})[0] : DATA[0];
    render();
  } else listView();
})();
</script>
</body></html>
