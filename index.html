<script>
function ghash(s){var h=5381;for(var i=0;i<s.length;i++){h=((h*33)^s.charCodeAt(i))>>>0;}return h;}
var GKEY=445125949;
function gopen(){document.getElementById("gate").style.display="none";}
function gtry(){
  var v=document.getElementById("gpw").value;
  if(ghash(v)===GKEY){ try{localStorage.setItem("g_ok","1");}catch(e){} gopen(); }
  else document.getElementById("gmsg").textContent="비밀번호가 다릅니다";
}
document.getElementById("gpw").addEventListener("keydown",function(e){ if(e.key==="Enter") gtry(); });
try{ if(localStorage.getItem("g_ok")==="1") gopen(); }catch(e){}
</script>

 것은?","given":"","psg":"Instructors of physical activities often focus more on the activities themselves than on the participants who perform them. People may believe that training our bodies is unrelated to training our minds. However, participants' minds determine their attitudes and level of effort toward physical development. In usual practice, instructors may just tell their participants to exercise regularly, warm up before exercising, or use a particular strategy. However, it is not sufficient for instructors to expect participants to blindly follow their directions in physical activities. Instructors must raise participants' awareness of how these activities enhance their physical performance. For example, an instructor could explicitly explain how warming up before exercising improves their performances. If participants understand the principles of these activities, it enables them to gradually take fuller ownership of their own development.","ch":["체육 교육은 학습자의 역량 향상을 위해 이론보다 실습을 강조해야 한다.","체육 활동은 참여자의 적성을 발굴하고 개발하는 데 집중해야 한다.","체육 지도자는 참여자가 체육 활동의 원리를 알고 훈련하도록 도와야 한다.","체육 프로그램은 참여자의 편의를 위해 단계적으로 계획되어야 한다.","체육 수업은 각 개인의 신체 능력에 맞는 다양한 활동을 제공해야 한다."],"ans":3,"pts":2,"foot":[],"needImg":false,"sents":[{"ck":[["Instructors of physical activities","신체 활동 지도자들은"],["often focus more","흔히 더 집중한다"],["on the activities themselves","활동 그 자체에"],["than on the participants","참여자들보다"],["who perform them.","그것을 수행하는"]],"g":"체육 지도자들은 활동을 하는 사람보다 활동 자체에 더 신경 쓰는 경우가 많다."},{"ck":[["People may believe","사람들은 믿을지도 모른다"],["that training our bodies","우리 몸을 훈련하는 것이"],["is unrelated to","~과 무관하다고"],["training our minds.","우리 마음을 훈련하는 것과"]],"g":"몸을 단련하는 일과 마음을 단련하는 일은 별개라고 여기기 쉽다."},{"ck":[["However,","그러나"],["participants' minds determine","참여자들의 마음이 결정한다"],["their attitudes and level of effort","그들의 태도와 노력의 수준을"],["toward physical development.","신체 발달을 향한"]],"g":"하지만 참여자의 <b>마음</b>이 신체 발달에 대한 태도와 노력의 크기를 좌우한다."},{"ck":[["In usual practice,","평소 연습에서"],["instructors may just tell" "디자인","k":"설계, 디자인, 설계하다"},"experts":{"p":"엑스퍼트","k":"전문가"}}},{"id":"2026-06-23","y":2026,"m":6,"q":23,"type":"주제","instr":"다음 글의 주제로 가장 적절한 것은?","given":"","psg":"A telescoping of time correlates with size. Small animals' reflexes must be quicker in order to control much smaller limbs and respond to rapid locomotor feedback. Further, decision making must be streamlined in small species because their high metabolic rates and minimal energy reserves offer few choices in food-searching activities, defending against predators, or mating behaviors. And, perhaps most important, a short lifetime offers little time for learning from experience. As a result, being short-lived puts a premium on the effectiveness of preprogrammed behavior patterns that require little in the way of environmental fine-tuning. Large animals, in comparison, can get by with rather slower reflexes, can afford to vary their mating and food-searching behaviors in an effort to better optimize their behaviors, and may have a considerable opportunity to learn by observation and trial and error. Being longer-lived puts a greater premium on learning and memory, and less on automatic preprogrammed behaviors. In addition, living a long time or having the capacity to travel for long distances is more likely to expose an animal to significant changes in the environment.","ch":["chances of survival for animals with different time perceptions","significance of animal size in life spans and survival skills","benefits of energy reserves in animals' environmental adaptation","limits of animals' decision making according to body size","influences of predetermined behavior patterns on animal survival"],"ans":2,"pts":2,"foot":[{"word":"limb","gloss":"(사람･동물의) 수족"},{"word":"locomotor","gloss":"운동 기관의"},{"word":"metabolic","gloss":"신진대사의"}],"needImg":false,"sents":[{"ck":[["A telescoping of time","시간의 압축은"],["correlates with size.","크기와 상관관계가 있다"]],"g":"시간이 압축되어 흐르는 정도는 몸집과 맞물려 있다."},{"ck":[["Small animals' reflexes must be quicker","작은 동물의 반사 작용은 더 빨라야 한다"],["in order to control much smaller limbs","훨씬 더 작은 수족을 조절하기 위해"],["and respond to rapid locomotor feedback.","그리고 빠른 운동 기관의 피드백에 반응하기 위해"]],"g":"작은 동물은 작은 팔다리를 다루고 빠른 운동 신호에 반응해야 하므로 반사가 더 빨라야 한다."},{"ck":[["Further,","게다가"],["decision making must be streamlined","의사 결정이 간소화되어야 한다"],["in small species","작은 종에서는"],["because their high metabolic rates","왜냐하면 그들의 높은 신진대사율과"],["and minimal energy reserves","매우 적은 에너지 비축량이"],["offer few choices","선택의 여지를 거의 주지 않기 때문이다"],["in food-searching activities,","먹이 찾기 활동에서"],["defending against predators,","포식자로부터 방어하는 데서"],["or mating behaviors.","혹은 짝짓기 행동에서"]],"g":"대사율은 높고 비축 에너지는 적으니, 먹이·방어·짝짓기에서 고를 여지가 없어 판단이 단순해져야 한다."},{"ck":[["And, perhaps most important,","그리고 아마도 가장 중요한 것은"],["a short lifetime offers little time","짧은 수명이 시간을 거의 주지 않는다는 점이다"],["for learning from experience.","경험에서 배울"]],"g":"무엇보다 <b>수명이 짧으면 경험으로 배울 시간 자체가 없다.</b>"},{"ck":[["As a result,","그 결과"],["being short-lived puts a premium","수명이 짧다는 것은 특히 중요하게 만든다"],["on the effectiveness of preprogrammed behavior patterns","미리 프로그램된 행동 패턴의 효과성을"],["that require little","거의 필요로 하지 않는"],["in the way of environmental fine-tuning.","환경에 맞춘 세밀한 조정을"]],"g":"그래서 짧게 사는 동물일수록, 환경에 맞춰 손볼 필요 없는 <b>본능적 행동</b>의 효율이 결정적이 된다."},{"ck":[["Large animals, in comparison,","이에 비해 큰 동물은"],["can get by with rather slower reflexes,","다소 느린 반사로도 그럭저럭 살아갈 수 있고"],["can afford to vary","바꿀 여유가 있으며"],["their mating and food-searching behaviors","자신의 짝짓기와 먹이 찾기 행동을"],["in an effort to better optimize their behaviors,","행동을 더 잘 최적화하려는 노력으로"],["and may have a considerable opportunity","그리고 상당한 기회를 가질 수 있다"],["to learn by observation and trial and error.","관찰과 시행착오로 배울"]],"g":"반대로 큰 동물은 반사가 느려도 되고, 행동을 바꿔 가며 다듬을 여유가 있으며, 보고 겪으며 배울 기회도 많다."},{"ck":[["Being longer-lived puts a greater premium","더 오래 산다는 것은 더 크게 중요하게 만든다"],["on learning and memory,","학습과 기억을"],["and less on automatic preprogrammed behaviors.","그리고 자동적인 본능 행동은 덜 중요하게 만든다"]],"g":"오래 살수록 <b>학습과 기억</b>의 값이 올라가고, 자동화된 본능의 값은 내려간다."},{"ck":[["In addition,","게다가"],["living a long time","오래 사는 것"],["or having the capacity to travel for long distances","혹은 장거리를 이동할 능력을 갖는 것은"],["is more likely to expose an animal","동물을 노출시킬 가능성이 더 크다"],["to significant changes in the environment.","환경의 중대한 변화에"]],"g":"오래 살거나 멀리 이동할수록 환경의 큰 변화를 겪을 일이 많아진다."}],"theme":"동물의 <b>몸집</b>이 시간 감각·수명·생존 방식을 함께 결정한다는 글이다. 작은 동물은 반사가 빨라야 하고, 신진대사가 높고 에너지 비축이 적어 의사 결정이 단순해야 하며, 무엇보다 <b>수명이 짧아 경험으로 배울 시간이 없다.</b> 그래서 미리 프로그램된 행동 패턴이 중요해진다. 반대로 큰 동물은 반사가 느려도 되고, 행동을 바꿔 가며 최적화할 여유가 있고, 관찰과 시행착오로 배울 기회가 많다. 즉 <b>오래 살수록 학습과 기억이 중요해지고, 자동 반응은 덜 중요해진다.</b>","why":"주제 문제는 <b>글 전체를 관통하는 축</b>을 찾는 것입니다. 이 글의 축은 처음부터 끝까지 '몸집(=수명)에 따라 생존 방식이 갈린다'입니다. ④는 의사 결정만, ⑤는 자동 행동만 떼어낸 <b>부분</b>이라 주제가 될 수 없습니다.","rub":[["① 몸집·수명","몸집 · 크기 · 작은 · 큰 · 수명 · 오래 · 짧게 · 사는 기간"],["② 작으면 본능·자동 행동","본능 · 미리 · 프로그램 · 자동 · 반사 · 빠른 판단 · 정해진"],["③ 크면 학습·기억","학습 · 배우 · 기억 · 경험 · 관찰 · 시행착오 · 적응"]],"dic":{"telescoping":{"p":"텔러스코우핑","k":"압축, 겹쳐 줄어듦"},"correlate with":{"p":"코뤌레잇","k":"~과 상관관계가 있다"},"reflex":{"p":"뤼플렉스","k":"반사 작용"},"limb":{"p":"림","k":"수족, 팔다리 (각주)"},"respond to":{"p":"뤼스판드","k":"~에 반응하다"},"locomotor":{"p":"로우커모우럴","k":"운동 기관의 (각주)"},"streamlined":{"p":"스트륌라인드","k":"간소화된"},"species":{"p":"스피시즈","k":"종(種)"},"metabolic rate":{"p":"메러발릭 뤠잇","k":"신진대사율 (각주)"},"minimal":{"p":"미니멀","k":"매우 적은, 최소한의"},"reserve":{"p":"뤼절브","k":"비축량"},"predator":{"p":"프뤠더털","k":"포식자"},"mating":{"p":"메이링","k":"짝짓기"},"lifetime":{"p":"라이프타임","k":"수명, 일생"},"put a premium on":{"p":"프뤼미엄","k":"~을 특히 중요하게 만들다"},"preprogrammed":{"p":"프뤼프로우그뢤드","k":"미리 프로그램된"},"fine-tuning":{"p":"파인 튜닝","k":"세밀한 조정"},"get by with":{"p":"겟 바이","k":"~으로 그럭저럭 살아가다"},"afford to":{"p":"어폴드 투","k":"~할 여유가 있다"},"vary":{"p":"베뤼","k":"변화시키다"},"optimize":{"p":"압티마이즈","k":"최적화하다"},"considerable":{"p":"컨씨더뤄블","k":"상당한"},"trial and error":{"p":"트롸이얼 앤 에뤌","k":"시행착오"},"capacity":{"p":"커패씨티","k":"능력, 용량"},"expose a to b":{"p":"익스포우즈","k":"A를 B에 노출시키다"},"significant":{"p":"씩니피컨트" ht and Dark Sides of Collapsing Tour Resources","Separate to Combined: Changes in the Tourism Business","Reduced Roles of Tour Operators in the Tourism Industry","Integration's Failure: Not Meeting Customers' Various Needs","New Challenges Facing Service Providers in Modern Tourism"],"ans":2,"pts":2,"foot":[{"word":"fragment","gloss":"파편이 되게 하다"}],"needImg":false,"sents":[{"ck":[["Before the 1950s,","1950년대 이전에"],["tourism was very much an industry","관광업은 대단히 ~한 산업이었다"],["which was fragmented;","파편화된"],["hotels, transport operators, travel agents, and tour operators","호텔, 운송업체, 여행사, 여행 상품 운영업체는"],["all tended to work independently of each other.","모두 서로 독립적으로 일하는 경향이 있었다"]],"g":"1950년대 이전 관광업은 조각조각 나뉜 산업이었고, 호텔·운송·여행사·여행상품업체가 따로 놀았다."},{"ck":[["Hotels were largely in the business","호텔은 대체로 사업을 하고 있었다"],["of selling bed nights.","숙박을 파는"]],"g":"호텔은 그저 '하룻밤 잠자리'를 파는 곳이었다."},{"ck":[["Airlines and railways","항공사와 철도 회사는"],["were in the business of selling seats.","좌석을 파는 사업을 하고 있었다"]],"g":"항공사와 철도는 '좌석'을 파는 곳이었다."},{"ck":[["Travel agents, of course,","물론 여행사는"],["were selling travel and holidays,","여행과 휴가 상품을 팔고 있었다"],["but in each case","하지만 각각의 경우에"],["they tended to operate","그들은 운영되는 경향이 있었다"],["very much as individual businesses.","대단히 별개의 사업체로"]],"g":"여행사는 여행과 휴가를 팔았지만, 어느 쪽이든 서로 남남인 개별 사업체였다."},{"ck":[["From the mid-1950s onwards,","1950년대 중반부터 계속"],["particularly in the UK,","특히 영국에서"],["the growth of tour operators","여행 상품 운영업체의 성장이"],["began to change the nature of the industry","산업의 성격을 바꾸기 시작했다"],["from essentially individual business activities","본질적으로 개별적인 사업 활동에서"],["to more integrated activities.","더 통합적인 활동으로"]],"g":"1950년대 중반부터, 특히 영국에서 여행상품업체가 커지며 산업이 <b>개별에서 통합으로</b> 바뀌기 시작했다."},{"ck":[["Hotels, for example,","예를 들어 호텔은"],["were beginning to see customers","고객을 보기 시작했다"],["as wanting a range of services","다양한 서비스를 원하는 사람으로"],["rather than simply buying accommodation.","단순히 숙박만 사는 사람이라기보다"]],"g":"호텔은 손님을 '잠만 자는 사람'이 아니라 '여러 서비스를 원하는 사람'으로 보기 시작했다."},{ usinessman and musician. As an undergraduate, he earned high honors from Corpus Christi College. After finishing graduate school, he was appointed as a lecturer at Oxford in the field of philosophy. During World War II, however, he served in the British military for about five years. One of his greatest contributions was to the study of language and communication. His article \"Meaning\" was written in 1948, but he did not have it published until 1957. This article was foundational in the study of language and communication. In 1967, he left Oxford to take a job at UC Berkeley and retired from there in 1979. In addition to being a great scholar, he was excellent at cricket and chess.","ch":["사업가이자 음악가인 Herbert Grice의 아들로 태어났다.","제2차 세계 대전 동안 영국 군대에서 약 5년간 복무하였다.","1948년에 \"Meaning\"이라는 논문을 출판했다.","UC Berkeley에서 1979년에 퇴직했다.","크리켓과 체스에 뛰어난 능력을 보였다."],"ans":3,"pts":2,"foot":[],"needImg":false,"sents":[{"ck":[["Paul Grice was a famous philosopher of language","Paul Grice는 유명한 언어철학자였다"],["whose work was very influential","그의 연구는 매우 영향력이 있었다"],["in many areas of linguistics.","언어학의 많은 분야에서"]],"g":"Paul Grice는 언어학 여러 분야에 큰 영향을 끼친 유명한 언어철학자였다."},{"ck":[["Born in 1913 in Birmingham, England,","1913년 영국 버밍엄에서 태어난"],["he was the son of Herbert Grice,","그는 Herbert Grice의 아들이었다"],["a businessman and musician.","사업가이자 음악가인"]],"g":"1913년 영국 버밍엄에서, 사업가이자 음악가인 Herbert Grice의 아들로 태어났다."},{"ck":[["As an undergraduate,","학부생이었을 때"],["he earned high honors","그는 우수한 성적을 받았다"],["from Corpus Christi College.","Corpus Christi 대학에서"]],"g":"학부 시절 Corpus Christi 대학에서 우수한 성적을 거뒀다."},{"ck":[["After finishing graduate school,","대학원을 마친 후"],["he was appointed as a lecturer at Oxford","그는 옥스퍼드의 강사로 임명되었다"],["in the field of philosophy.","철학 분야에서"]],"g":"대학원을 마치고 옥스퍼드 철학과 강사로 임명되었다."},{"ck":[["During World War II, however,","그러나 제2차 세계 대전 동안"],["he served in the British military","그는 영국 군대에서 복무했다"],["for about five years.","약 5년간"]],"g":"다만 2차 대전 동안에는 약 5년간 영국군에서 복무했다."},{"ck":[["One of his greates  came to be explicitly incorporated into cultural ceremonies so that ⑤their wearers' roles could be identified clearly.","ch":[],"ans":2,"pts":2,"foot":[],"needImg":false,"sents":[{"ck":[["Fashion is always deeply cultural,","패션은 언제나 깊이 문화적이다"],["and an excellent example of this","그리고 이것의 훌륭한 예는"],["can be seen in the evolution of European clothing.","유럽 의복의 발전에서 볼 수 있다"]],"g":"패션은 늘 문화와 맞물려 있고, 그 좋은 예가 유럽 의복의 변천이다."},{"ck":[["At the beginning of the Middle Ages,","중세 초기에는"],["clothing tended to be simple","의복이 단순한 경향이 있었다"],["and was ①frequently made","그리고 자주 만들어졌다"],["of rough wool or animal furs.","거친 양모나 동물 모피로"]],"g":"중세 초에는 옷이 단순했고 거친 양모나 짐승 가죽으로 만드는 일이 잦았다."},{"ck":[["With advances in cloth making, however,","그러나 직물 제작의 발전과 함께"],["fashion began moving toward styles","패션은 스타일로 나아가기 시작했다"],["②what were more elaborate and form-fitting.","더 정교하고 몸에 꼭 맞는"]],"g":"직물 기술이 발전하자 패션은 더 정교하고 몸에 붙는 스타일로 옮겨 갔다. <b>(styles를 받는 자리 → that/which)</b>"},{"ck":[["In the Renaissance and Elizabethan eras,","르네상스와 엘리자베스 시대에는"],["styles became even more refined.","스타일이 훨씬 더 세련되어졌다"]],"g":"르네상스와 엘리자베스 시대에 이르러 스타일은 한층 더 세련되어졌다."},{"ck":[["The clothes that wealthy people were wearing","부유한 사람들이 입던 옷은"],["became increasingly fancier,","점점 더 화려해졌다"],["with a particular emphasis being placed","특별한 강조가 놓인 채로"],["on smaller waists.","더 잘록한 허리에"]],"g":"부자들의 옷은 갈수록 화려해졌고, 특히 <b>잘록한 허리</b>가 강조되었다."},{"ck":[["The connection between clothing and social status","의복과 사회적 지위 사이의 연관성은"],["was so pronounced","너무나 뚜렷해서"],["that laws were enacted","법이 제정되었다"],["③to limit the wearing","착용을 제한하기 위해"],["of certain luxury items.","특정 사치품의"]],"g":"옷과 지위의 연결이 너무 뚜렷한 나머지, 특정 사치품 착용을 제한하는 법까지 만들어졌다."},{"ck":[["④Allowed only for higher social classes,","더 높은 사회 계층에게만 허용되어"],["luxurious styles and decorations","사치스러운 스타일과 장식들은"],["such as feathers, silk, or velvet","깃털, 비단, 벨벳 같은"],["were used as a means","수단으로 사용되었다"],["of demonstrating one's standing in society.","사회에서 자신의 지위를 보여 주는"]],"g":"깃털·비단·벨벳 같은 사치스러운 스  한다"],["not to let the poetic form or archaic word usage","시적 형식이나 고어체 어휘 사용이"],["get in the way of getting meaningful information","의미 있는 정보를 얻는 것을 방해하지 않도록"],["about the story,","이야기에 관한"],["but instead see the form itself","대신 그 형식 자체를 보아야 한다"],["as a ①revealing stylistic technique.","내용을 드러내는 문체적 기법으로"]],"g":"시적 형식이나 옛말이 정보 얻기를 <b>방해하게 두지 말고</b>, 그 형식 자체를 내용을 드러내는 기법으로 봐야 한다."},{"ck":[["Scripts with complex language or unfamiliar styles","복잡한 언어나 낯선 문체를 가진 대본은"],["may require several additional readings","여러 번의 추가 독서를 요구할 수 있다"],["in order for the nuance to become ②clear.","그 뉘앙스가 분명해지도록"]],"g":"언어가 복잡하거나 문체가 낯선 대본은 뉘앙스가 잡힐 때까지 몇 번 더 읽어야 할 수도 있다."},{"ck":[["Musical theater pieces are particularly difficult","뮤지컬 작품은 특히 어렵다"],["to visualize when reading","읽을 때 머릿속에 그리기가"],["because of the diminished emphasis on dialogue","대화에 대한 강조가 줄어들었기 때문에"],["and a ③significant emphasis on song and dance.","그리고 노래와 춤에 대한 강조가 상당하기 때문에"]],"g":"뮤지컬은 대사 비중이 줄고 노래·춤 비중이 커서, 읽으며 장면을 떠올리기가 특히 어렵다."},{"ck":[["For example,","예를 들어"],["when the music and lyrics are removed","음악과 가사가 제거되면"],["from a musical theater script,","뮤지컬 대본에서"],["what is left is the dialogue,","남는 것은 대화이다"],["known as the book or libretto,","극본 또는 대본이라 불리는"],["and it can be very ④thick.","그리고 그것은 매우 두꺼울 수 있다"]],"g":"뮤지컬 대본에서 음악과 가사를 빼면 대사만 남는데, 그것은 매우 <b>두껍다(→ 얇다)</b>."},{"ck":[["There is an emphasis on dance, movement, or action","춤, 움직임, 동작에 대한 강조가 있다"],["in musical theater","뮤지컬에서는"],["that can be ⑤time-consuming","그것은 시간이 많이 걸릴 수 있다"],["when actually performed on stage,","실제로 무대에서 공연될 때는"],["but can take very little space","하지만 아주 적은 공간만 차지할 수 있다"],["when typed into a play script.","희곡 대본에 인쇄될 때는"]],"g":"뮤지컬의 춤·동작은 무대에서는 시간을 많이 잡아먹지만, 대본에 적으면 <b>몇 줄이면 끝난다.</b>"}],"theme":"고전 희곡과 뮤지컬 대본을 <b>읽어 내기 어려운 이유</b>를 설명하는 글이다. 셰익스피어·에우리피데스나 뮤지컬 가사는 인물의 생각과 감정을 관습적이지 않은 방식으로 전달해, 기술과 인내가 더 필요하다. 시적 형식이나 고어체를 방해물로 여기지 말고 <b>형식 자체를 내용을 드러내는 기법</b>으로 봐야 한다. 특히 뮤지컬은 대화 비중이 줄고 노래·춤 비중이 커서 머릿속에 그리기 어렵다. 음악과 가사를 빼면 남는 대본은 <b>매우 얇고</b>, 무대에서 오래 걸리는 춤·동작도 대본에서는 몇 줄 차지하지 않는다.","why":"④ 앞뒤를 보세요 — 음악과 가사를 <b>빼고 나면</b> 남는 게 대사뿐이고, 바로 다음 문장에서 춤·동작이 대본에서는 <i>very little space</i>를 차지한다고 합니다. 그러니 대본은 두꺼운 게 아니라 <b>얇아야</b> 합니다. thick → thin.","rub":[["① 고전·뮤지컬 대본","고전 · 희곡 · 셰익스피어 · 뮤지컬 · 대본 · 가사 · 작품"],["② 읽고 그려 내기 어려움","어렵 · 힘들 · 인내 · 여러 번 · 그리기 · 상상 · 이해"],["③ 형식 자체가 단서 / 대본은 얇음","형식 · 문체 · 기법 · 단서 · 노래 · 춤 · 얇 · 적은 공간"]],"dic":{"classical work":{"p":"클래씨컬 월크","k":"고전 작품"},"playwright":{"p":"플레이롸잇","k":"극작가"},"lyrics":{"p":"리뤽스","k":"노래 가사"},"contain":{"p":"컨테인","k":"담다, 포함하다"},"unconventional":{"p":"언컨벤셔널","k":"관습적이지 않은"},"unrealistic":{"p":"언뤼얼리스틱","k":"비현실적인"},"character":{"p":"캐뤽털","k":"등장인물"},"patience":{"p":"페이션스","k":"인내"},"mindful":{"p":"마인드풀","k":"주의하는, 유념하는"},"poetic":{"p":"포우에릭","k":"시적인"},"archaic":{"p":"알케익","k":"고어체의 (각주)"},"get in the way of":{"p":"겟 인 더 웨이","k":"~을 방해하다"},"revealing":{"p":"뤼빌링","k":"(내용을) 드러내는"},"stylistic":{"p":"스타일리스틱","k":"문체의"},"technique":{"p":"테크닉","k":"기법"},"script":{"p":"스크륍트","k":"대본"},"unfamiliar":{"p":"언퍼밀려","k":"낯선"},"additional":{"p":"어디셔널","k":"추가의"},"nuance":{"p":"누안스","k":"뉘앙스, 미묘한 차이"},"visualize":{"p":"비주얼라이즈","k":"머릿속에 그리다"},"diminished":{"p":"디미니쉬트","k":"줄어든"},"dialogue":{"p":"다이얼로그","k":"대화, 대사"},"significant":{"p":"씩니피컨트","k":"상당한"},"libretto":{"p":"리브뤠토우","k":"(가극) 대본"},"time-consuming":{"p":"타임 컨쑤밍","k":"시간이 많이 걸리는"},"perform":{"p":"펄폼","k":"공연하다"},"such":{"p":"써치","k":"그러한, ~와 같은,매우 ~한"},"may":{"p":"메이","k":"~해도 좋다"},"feelings":{"p":"필링","k":"감정, 느낌"},"playwrights":{"p":"플레이롸잇","k":"극작가"},"instead":{"p":"인스뗏","k":"대신에"},"musical":{"p":"뮤지컬","k":"음악의, 뮤지컬"},"clear":{"p":"클리얼","k":"(날씨가) 맑은"},"understand":{"p":"언덜스탠드","k":"이해하다"},"theater":{"p":"띠어럴","k":"극장, 연극"},"order":{"p":"오덜","k":"질서를 세우다"},"music":{"p":"뮤직","k":"음악"},"emphasis":{"p":"엠퍼시스","k":"강조"},"form":{"p":"","k":"형태, 서식, 형성하다"},"pieces":{"p":"피쓰","k":"조각"},"works":{"p":"월크","k":"효과가 있다"},"left":{"p":"레프트","k":"왼쪽; 왼쪽의; 왼쪽으로"},"typed":{"p":"타이프","k":"종류, 유형"},"stage":{"p":"스떼이쥐 onetheless call themselves conservationists) think of themselves more as protectors. They sometimes criticize conservationists for setting an additional priority on yield or harvest or use, rather than interfering as minimally as possible in order to preserve the original object or system, as they would do. Preservationists would, for example, prefer to keep a historical musical instrument \"as found\" in a deteriorated state, for study, rather than to restore or repair it for display or use.","ch":["desired","unstable","isolated","natural","delicate"],"ans":1,"pts":2,"foot":[{"word":"contemplation","gloss":"주시(注視)"},{"word":"deteriorate","gloss":"나쁘게 하다"}],"needImg":false,"sents":[{"ck":[["Ever since the early Enlightenment,","초기 계몽주의 이후로 줄곧"],["preservation and conservation","보존과 보전은"],["have been closely related.","밀접하게 관련되어 왔다"]],"g":"계몽주의 초기 이래로 '보존'과 '보전'은 서로 가까운 말이었다."},{"ck":[["Taken as near synonyms,","거의 동의어로 받아들여질 때"],["their meaning is to maintain an object or system","그것들의 의미는 사물이나 체계를 유지하는 것이다"],["insofar as possible in its present state,","가능한 한 그것의 현재 상태로"],["to protect it from change,","그것을 변화로부터 보호하는 것이다"],["usually for contemplation, research, display,","보통 주시, 연구, 전시를 위해"],["and perhaps for use.","그리고 아마도 사용을 위해"]],"g":"거의 같은 말로 쓸 때 둘 다 '되도록 현재 상태로 유지하고 변화로부터 지킨다'는 뜻이다 — 주시·연구·전시, 때로는 사용을 위해."},{"ck":[["Conservationists who distinguish their activities","자기 활동을 구별하는 보전주의자들은"],["from preservation","보존과"],["emphasize conservation's restorative aspects","보전의 복원적 측면을 강조한다"],["― restoring a historical musical instrument, for example,","― 예를 들어 역사적인 악기를 복원하는 것"],["or a painting, or a dinosaur, or an ecosystem.","혹은 그림, 공룡, 생태계를"]],"g":"보전주의자는 자기 일을 보존과 구별하며 <b>복원</b>을 내세운다 — 옛 악기, 그림, 공룡, 생태계를 되살리는 일이다."},{"ck":[["Conservationists acknowledge change","보전주의자들은 변화를 인정한다"],["but try to manage it","하지만 그것을 관리하려 한다"],["in order to prolong a(n) _____ state.","_____ 상태를 연장하기 위해"]],"g":"보전주의자는 변화를 인정하되, <b>원하는</b> 상태를 오래 끌고 가려고 변화를 관리한다."},{"ck":[["Preservationists","보존주의자들은"],["(who may nonetheless call themselves conservationists)","(그럼에도 스스로를 보전주의자라 부를 수도 있는)"],["think of themselves more as protectors.","자신을 보호자에 더 가깝다고 여긴다"]],"g":"보존주의자는 (스스로를 보전주의자라 부르기도 하지만) 자신을 <b>지키는 사람</b>으로 여긴다."},{"ck":[["They sometimes criticize conservationists","그들은 때때로 보전주의자들을 비판한다"],["for setting an additional priority","추가적인 우선순위를 두는 것에 대해"],["on yield or harvest or use,","산출량이나 수확 또는 이용에"],["rather than interfering as minimally as possible","가능한 한 최소한으로 개입하기보다는"],["in order to preserve the original object or system,","원래의 사물이나 체계를 보존하기 위해"],["as they would do.","자신들이 하듯이"]],"g":"보존주의자는, 개입을 최소로 해 원본을 지키기보다 <b>산출·수확·이용</b>에 우선순위를 더 두는 보전주의자를 비판하기도 한다."},{"ck":[["Preservationists would, for example,","예를 들어 보존주의자는"],["prefer to keep a historical musical instrument","역사적인 악기를 유지하는 쪽을 선호할 것이다"],["\"as found\" in a deteriorated state,","손상된 상태 그대로 '발견된 그대로'"],["for study,","연구를 위해"],["rather than to restore or repair it","그것을 복원하거나 수리하기보다는"],["for display or use.","전시나 이용을 위해"]],"g":"가령 보존주의자는 옛 악기를 전시·사용하려 고치기보다, 연구를 위해 <b>망가진 그대로</b> 두는 편을 택한다."}],"theme":"<b>보존(preservation)</b>과 <b>보전(conservation)</b>의 차이를 가르는 글이다. 거의 동의어로 쓰일 때 둘 다 '지금 상태 그대로 지키고 변화로부터 보호한다'는 뜻이다. 그러나 자기 활동을 구별하는 보전주의자는 <b>복원</b>의 측면을 강조한다 — 악기·그림·공룡·생태계를 되살리는 것이다. 이들은 변화를 인정하되, 원하는 상태를 오래 끌고 가려고 변화를 <b>관리</b>한다. 반면 보존주의자는 스스로를 보호자로 여겨, 개입을 최소로 하고 손상된 악기도 <b>'발견된 그대로'</b> 두는 쪽을 택한다.","why":"빈칸 문장은 '보전주의자는 변화를 인정하되 <u>____</u> 상태를 <b>연장하려고</b> 관리한다'입니다. 연장하고 싶은 상태라면 <b>원하는(desired)</b> 상태여야 말이 됩니다. ② unstable(불안정한)·⑤ delicate(취약한) 상태를 일부러 늘리려 할 이유가 없고, ④ natural은 뒤에 나오는 '복원·수확·이용'과 어긋납니다.","rub":[["① 보존 vs 보전","보존 · 보전 · preservation · conservation · 구별 · 차이"],["② 보전 = 복원·관리","복원 · 되살 · 고치 · 수리 · 관리 · 변화 인정 · 이용 · 수확"],["③ 보존 = 그대로 두기","그대로 · 원래 · 손대지 · 최소 · 개입 · 보호 · 발견된 그대로"]],"dic":{"enlightenment":{"p":"인라이튼먼트","k":"계몽주의"},"preservation":{"p":"프뤠절베이션","k":"보존(원래 상태 그대로 지킴)"},"conservation":{"p":"칸썰베이션","k":"보전(관리하며 지킴)"},"synonym":{"p":"씨너님","k":"동의어"},"maintain":{"p erceptual disposition","겁쟁이의 지각적 성향은"],["is affected by his disposition","그의 성향에 영향을 받는다"],["to experience fear.","두려움을 경험하려는"]],"g":"겁쟁이가 무엇을 어떻게 보는지는 두려움을 느끼는 성향에 물들어 있다."},{"ck":[["A lover's expectations","사랑에 빠진 사람의 기대는"],["are affected by desire.","욕망에 영향을 받는다"]],"g":"사랑에 빠진 사람의 기대는 욕망에 물들어 있다."},{"ck":[["In such cases,","그런 경우에는"],["a small similarity","약간의 유사성이"],["between a perceived object and the thing one expects to see","지각된 대상과 보리라 기대하는 것 사이의"],["can lead to the misidentification","오인으로 이어질 수 있다"],["of the perceived object as that thing.","지각된 대상을 바로 그것으로"]],"g":"그런 때는 <b>조금만 닮아도</b> 본 것을 기대하던 그것으로 착각하게 된다."},{"ck":[["The coward sees the enemy,","겁쟁이는 적을 본다"],["while the lover sees the object of desire","반면 사랑에 빠진 사람은 욕망의 대상을 본다"],["everywhere.","어디에서나"]],"g":"겁쟁이는 어디서나 적이 보이고, 연인은 어디서나 그 사람이 보인다."},{"ck":[["The more affected one is,","사람이 더 많이 영향을 받을수록"],["_____.","_____"]],"g":"감정에 휘둘릴수록, <b>그것으로 보이는 데 필요한 닮은 구석은 더 적어진다.</b>"},{"ck":[["While the central organ of sense","감각의 중추 기관은"],["normally functions","보통 기능하지만"],["by comparing similarities and differences,","유사점과 차이점을 비교함으로써"],["emotions dispose one to discern objects","감정은 사람이 대상을 분별하도록 이끈다"],["inaccurately.","부정확하게"]],"g":"감각 기관은 원래 닮은 점과 다른 점을 <b>견주어</b> 작동하는데, 감정은 그 분별을 어긋나게 만든다."},{"ck":[["The greater the emotional investment,","감정적 몰입이 클수록"],["the more biased one's perception.","지각은 더 편향된다"]],"g":"감정을 많이 쏟을수록 지각은 그만큼 더 기울어진다."}],"theme":"<b>감정이 지각을 왜곡한다</b>는 아리스토텔레스식 논의다. 지각이 대상을 제대로 분별하지 못하는 상황(감정·질병·수면)에서도 상상력은 계속 작동한다. 겁쟁이의 지각은 두려움에, 사랑에 빠진 사람의 기대는 욕망에 물든다. 그런 경우 <b>아주 조금만 닮아도</b> 본 것을 기대하던 그것으로 오인한다. 겁쟁이는 어디서나 적을 보고, 연인은 어디서나 욕망의 대상을 본다. 감각 기관은 원래 유사점과 차이점을 <b>비교</b>해서 작동하는데, 감정은 그 분별을 부정확하게 만든다. 감정적 몰입이 클수록 지각은 더 편향된다.","why":"빈칸은 <i>The more affected one is, <u>____</u></i>라는 <b>비례 구문</b>입니다. 앞에서 '조금만 닮아도 오인한다'고 했으니, 감정에 더 휘둘릴수록 <b>필요한 유사성은 더 적어진다</b>가 됩니다. 답은 ②. ④는 '세상을 있는 그대로 감지한다'라 글의 방향과 정반대입니다.","rub":[["① 감정이 지각을 왜곡","감정 · 두려움 · 욕망 · 왜곡 · 편향 · 치우 · 물들"],["② 조금만 닮아도 오인","조금 · 약간 ·  <b>미술사의 한 조각</b>을 사는 것이거나, 아니면 (고양이나 기념품 같은 개인 취향의 물건 말고는) 아무것도 사지 않는 것이다. 수표에 서명하면서 그는 그 작품이 미술 전체가 도달한 중요한 지점으로 <b>미래에도 남으리라</b>고 단언한다. 하지만 역사는 무엇에나 열려 있고, 그 가치는 기껏해야 <b>오늘의 합의</b>일 뿐이며 그 합의는 거의 확실히 뒤집힌다. 결국 한 그림에 자신을 거는 것은 수집가 자신의 행위다.","why":"빈칸은 '그는 자신의 미학적 판단뿐 아니라 <u>____</u>라는 <b>확신</b>까지 용감하게 단언한다'입니다. 앞에서 '오늘의 합의는 반드시 뒤집힌다'고 못 박았으니, 그럼에도 사는 행위는 <b>미술이 어디로 갈지 자신이 내다볼 수 있다</b>는 확신을 거는 셈입니다. 답은 ①. ④(즉각적 이익)는 글에 없는 얘기입니다.","rub":[["① 미술 가치는 가변적","가치 · 변하 · 흔들 · 가변 · 의존 · 불확실 · 합의"],["② 합의는 뒤집힌다","합의 · 뒤집 · 대체 · 바뀌 · 무너 · 영원하지 않"],["③ 수집가 자신의 판단·예측","수집가 · 자신 · 스스로 · 판단 · 확신 · 예측 · 내다 · 걸"]],"dic":{"dependent":{"p":"디펜던트","k":"의존적인"},"shifting":{"p":"쉬프팅","k":"가변적인, 변하는"},"nature":{"p":"네이철","k":"속성, 본질"},"inherently":{"p":"인히어뤈틀리","k":"본질적으로"},"uppermost":{"p":"어펄모우스트","k":"가장 앞자리의, 최우선의"},"collector":{"p":"컬렉털","k":"수집가"},"representative":{"p":"뤠프뤼젠터티브","k":"대표자"},"institution":{"p":"인스티투션","k":"기관"},"acquire":{"p":"어콰이얼","k":"소장하다, 획득하다"},"souvenir":{"p":"쑤버니얼","k":"기념품"},"assert":{"p":"어썰트","k":"단언하다"},"presence":{"p":"프뤠즌스","k":"존재, 있음"},"significant":{"p":"씩니피컨트","k":"중요한"},"attain":{"p":"어테인","k":"도달하다, 이루다"},"as a whole":{"p":"애즈 어 호울","k":"전체로서"},"merit":{"p":"메륏","k":"가치, 장점"},"sculpture":{"p":"스컬프철","k":"조각(품)"},"at best":{"p":"앳 베스트","k":"기껏해야"},"validation":{"p":"밸리데이션","k":"확인, 인정"},"consensus":{"p":"컨쎈써스","k":"합의 (각주)"},"all but":{"p":"올 벗","k":"거의"},"displace":{"p":"디스플레이스","k":"대체하다, 밀어내다"},"in the last analysis":{"p":"라스트 어낼러씨스","k":"결국, 따지고 보면"},"commit oneself to":{"p":"커밋","k":"~에 자신을 걸다, 헌신하다"},"courageously":{"p":"커뤠이져슬리","k":"용감하게"},"affirm":{"p":"어펌","k":"확언하다"},"aesthetic":{"p":"에스쎄릭","k":"미학의 (각주)"},"derive":{"p":"디롸이브","k":"유래하다"},"conviction":{"p":"컨빅션","k":"확신"},"buys":{"p":"바이","k":"사다, 구입하다"},"affirms":{"p":"어펌","k":"확언하다"},"originality":{"p":"어뤼쥐낼러티","k":"독창성"},"acquiring":{"p":"어콰이얼","k":"소장하다, 획득하다"},"same":{"p":"쎄임","k":"같은, 동일한"},"choice":{"p":"쵸이쓰","k":"선택"},"own":{"p":"오운","k":"소유하다, 자기 자신의"},"mind":{"p":"마인드","k":"신경을 쓰다, eed, to do themselves much damage. ②Because of their increased mass (compounded by the fact that they are falling from a greater height and that their reactions may be slower), adults falling over will impact the ground with a much larger force. ③The nonlinear relationship between mass and bone strength means that although their bones are thicker than a toddler's in absolute terms, they may not be relatively thick enough to compensate for the larger impact caused by their increased mass. ④The body mass index (BMI) can serve as a convenient way for non-experts to examine their health conditions in daily lives. ⑤For the same reasons, taller people have been found to suffer more fall-related injuries ― like hip breaks ― than shorter people.","ch":[],"ans":4,"pts":2,"foot":[{"word":"innocuous","gloss":"무해한"},{"word":"toddler","gloss":"아장아장 걷는 아기"}],"needImg":false,"sents":[{"ck":[["The bigger someone is,","누군가의 몸집이 클수록"],["the more damage they can do to themselves","그들은 스스로에게 더 많은 해를 입힐 수 있다"],["through even a relatively innocuous accident.","비교적 무해한 사고를 통해서조차"]],"g":"몸집이 클수록, 별것 아닌 사고로도 스스로에게 더 큰 상해를 입힐 수 있다."},{"ck":[["Despite toddlers falling over and bumping themselves regularly,","아기들이 자주 넘어지고 부딪히는데도"],["the injuries they sustain","그들이 입는 부상은"],["are rarely serious.","심각한 경우가 드물다"]],"g":"아장아장 걷는 아기는 툭하면 넘어지고 부딪히는데도 크게 다치는 일이 드물다."},{"ck":[["①Their relatively thick bones","상대적으로 두꺼운 그들의 뼈는"],["in comparison to their mass","그들의 몸무게에 비해"],["mean they rarely build up enough energy,","그들이 충분한 에너지를 좀처럼 쌓지 못함을 뜻한다"],["even at top speed,","최고 속도에서조차"],["to do themselves much damage.","스스로에게 큰 해를 입힐 만큼"]],"g":"몸무게에 비해 뼈가 두꺼워서, 전속력으로 부딪혀도 자신을 크게 상하게 할 만한 에너지가 좀처럼 모이지 않는다."},{"ck":[["②Because of their increased mass","늘어난 몸무게 때문에"],["(compounded by the fact","(~라는 사실이 겹쳐"],["that they are falling from a greater height","그들이 더 높은 곳에서 떨어지고 있다는"],["and that their reactions may be slower),","그리고 그들의 반응이 더 느릴 수 있다는),"],["adults falling over will impact the ground","넘어지는 어른은 바닥에 충돌 h":["(A) - (C) - (B)","(B) - (A) - (C)","(B) - (C) - (A)","(C) - (A) - (B)","(C) - (B) - (A)"],"ans":4,"pts":3,"foot":[{"word":"prevailing","gloss":"주요한"},{"word":"deploy","gloss":"전개하다"}],"needImg":false,"sents":[{"ck":[["Although there may be elements","요소들이 있을 수는 있지만"],["that trigger instinctive response,","본능적 반응을 유발하는"],["spectacle works primarily within a cultural frame","구경거리는 주로 문화적 틀 안에서 작동한다"],["and is subject to prevailing modes of perception","그리고 주요한 지각 방식에 영향을 받는다"],["that observers bring to bear.","관찰자들이 적용하는"]],"g":"본능을 건드리는 요소도 있겠지만, 구경거리는 주로 <b>문화적 틀</b> 안에서 작동하며 보는 이가 지닌 지각 방식에 좌우된다."},{"ck":[["(A) By extension,","(A) 더 나아가"],["spectacle is produced","구경거리는 만들어진다"],["by working with the grain of a particular culture,","특정 문화의 결에 맞추어 작업함으로써"],["blending the innovative with the established.","혁신적인 것과 기존의 것을 섞으면서"]],"g":"(A) 더 나아가 구경거리는 그 문화의 결을 따라, <b>새것과 익숙한 것을 섞어</b> 만들어진다."},{"ck":[["Thus anyone deploying spectacle","따라서 구경거리를 전개하는 누구든"],["may draw on a repertoire of techniques and conventions","기법과 관습의 레퍼토리를 끌어 쓸 수 있다"],["developed from previous festivals or related activities,","이전의 축제나 관련 활동에서 발전된"],["but imitation is not enough.","하지만 모방만으로는 충분하지 않다"]],"g":"이전 축제에서 쌓인 기법과 관습을 가져다 쓸 수는 있지만, <b>흉내만으로는 부족하다.</b>"},{"ck":[["(B) Spectacle must also be spectacular.","(B) 구경거리는 또한 장관이어야 한다"]],"g":"(B) 구경거리는 <b>구경거리다워야</b>, 즉 장관이어야 한다."},{"ck":[["A spectacle has to amaze spectators,","구경거리는 관객을 놀라게 해야 한다"],["outdoing previous efforts","이전의 시도들을 능가하면서"],["if it is to become part of the collective memory","집단 기억의 일부가 되려면"],["of those who witnessed and participated in it.","그것을 목격하고 참여한 사람들의"]],"g":"보고 참여한 이들의 <b>집단 기억</b>에 남으려면, 이전을 능가할 만큼 관객을 놀라게 해야 한다."},{"ck":[["(C) In saying that,","(C) 그렇게 말하면서"],["we stress that creation of spectacle","우리는 구경거리의 창조가"],["is neither a universal nor even an inevitable expression of culture,","문화의 보편적 표현도 필연적 표현도 아니라고 강조한다"],["but is a strategy commonly used","오히려 흔히 사용되는 전략이라고"],["by people from many different cultures","여러 다양한 문화권의 사람들에 의해"],["to address specific needs.","특정한 필요를 해결하기 위해"]],"g":"(C) 그렇게 말하면서 우리는, 구경거리 만들기가 문화의 보편적·필연적 표현이 아니라 특정 필요를 채우려 쓰는 <b>전략</b>임을 강조한다."},{"ck":[["The task of creating spectacle","구경거리를 만드는 과업은"],["has been likened to creating new works of literature,","새로운 문학 작품을 창작하는 것에 비유되어 왔다"],["where writers normally feel bound","거기서 작가들은 보통 얽매인다고 느끼면서도"],["by the rules and traditions of their genre","자기 장르의 규칙과 전통에"],["yet need to show sufficient originality","충분한 독창성을 보여야 한다"],["to impress their audiences.","독자에게 깊은 인상을 주려면"]],"g":"그 일은 문학 창작에 비유돼 왔다 — 작가는 장르의 규칙에 매인 채로도 <b>충분한 독창성</b>을 보여야 한다."}],"theme":"<b>구경거리(spectacle)</b>가 어떻게 만들어지는가를 다룬다. 주어진 글은 구경거리가 본능이 아니라 <b>문화적 틀</b> 안에서 작동한다고 못 박는다. (C)는 '그렇게 말하면서'로 그 말을 받아, 구경거리 창조가 보편적·필연적 표현이 아니라 여러 문화권이 특정 필요를 채우려 쓰는 <b>전략</b>임을 강조하고, 장르의 규칙에 얽매이면서도 독창성을 보여야 하는 <b>문학 창작</b>에 비유한다. (A)는 그 비유를 이어받아 '기존과 혁신을 섞되 <b>모방만으로는 부족하다</b>'고 하고, (B)는 그 부족한 부분을 채운다 — 구경거리는 이전을 능가할 만큼 <b>놀라워야</b> 집단 기억에 남는다.","why":"(C)의 첫머리 <i>In saying that</i>이 결정적입니다. 주어진 글의 주장을 그대로 받는 표현이므로 (C)가 먼저 옵니다. 이어 (C) 끝의 <b>문학 비유</b>(규칙에 얽매이되 독창성 필요)를 <i>By extension</i>으로 확장하는 (A), 마지막으로 <i>must also be spectacular</i>로 조건을 하나 더 얹는 (B). 따라서 <b>(C)-(A)-(B)</b> = ④.","rub":[["① 구경거리는 문화적","구경거리 · 볼거리 · 스펙터클 · 문화 · 틀 · 지각 · 관객"],["② 기존을 따르되 독창성 필요","기존 · 관습 · 전통 · 규칙 · 모방 · 부족 · 독창 · 혁신 · 섞"],["③ 놀라워야 기억에 남음","놀라 · 장관 · 능가 · 압도 · 기억 · 남 · 인상"]],"dic":{"element":{"p":"엘러먼트","k":"요소"},"trigger":{"p":"트뤼걸","k":"유발하다"},"instinctive":{"p":"인스팅티브","k":"본능적인"},"spectacle":{"p":"스펙터클","k":"구경거리, 볼거리"},"primarily":{"p":"프롸이메뤌리","k":"주로"},"be subject to":{"p":"썹젝트 투","k":"~에 영향을 받다, ~에 좌우되다"},"prevailing":{"p":"프뤼베일링","k":"주요한, 지배적인 (각주)"},"perception":{"p":"펄쎕션","k":"지각"},"bring to bear":{"p":"브륑 투 베얼","k":"적용하다, 작용시키다"},"by extension":{"p":"바이 익스텐션","k":"더 나아가, 확장하면"},"grain":{"p":"그뤠인","k":"결, 나뭇결"},"blend a with b":{"p":"블렌드","k":"A를 B와 섞다"},"innovative":{"p":"이너베이티브","k":"혁신적인"},"established":{"p":"이스태블리쉬트","k":"기존의, 확립된"},"deploy":{"p":" an become dangerously self-sustaining. ( ③) Orienting the building so that the longer face of the structure is parallel with prevailing winds can help. ( ④) Chopping or rounding off corners of a building can likewise make it more aerodynamic. ( ⑤) Roughing up the corners of the building through the careful placement of balconies or stepped corners can help by disturbing or delaying the formation of strong vortices.","ch":[],"ans":3,"pts":2,"foot":[{"word":"vortex","gloss":"회오리바람"},{"word":"perpendicular","gloss":"직각을 이루는"}],"needImg":false,"sents":[{"ck":[["To minimize vortex shedding,","와류 방출을 최소화하기 위해"],["skyscraper designers do everything in their powers","초고층 빌딩 설계자들은 힘닿는 모든 것을 한다"],["to confuse the wind.","바람을 교란시키려고"]],"g":"<b>[주어진 문장]</b> 와류를 줄이려고 초고층 설계자들은 바람을 헷갈리게 만들 수 있는 모든 수를 쓴다."},{"ck":[["To minimize building costs and maximize revenues,","건축 비용을 최소화하고 수익을 극대화하기 위해"],["skyscrapers generally take the shape","초고층 빌딩은 일반적으로 형태를 취한다"],["of squares or rectangles.","정사각형이나 직사각형의"]],"g":"비용을 줄이고 수익을 키우려다 보니 초고층 건물은 대체로 네모난 형태가 된다."},{"ck":[["These are not particularly aerodynamic shapes,","이것들은 특별히 공기역학적인 형태가 아니다"],["and this results in a wind phenomenon","그리고 이는 바람 현상을 초래한다"],["called \"vortex shedding.\"","'와류 방출'이라 불리는"]],"g":"그런데 네모는 공기역학적이지 않아서 <b>'와류 방출'</b>이라는 바람 현상을 부른다."},{"ck":[["As wind meets a rectangular skyscraper","바람이 직사각형 초고층 빌딩을 만나면"],["it pushes on the flat face of the building","그것은 건물의 평평한 면을 민다"],["before flowing around its sides,","옆면을 돌아 흐르기 전에"],["where eventually it separates","그리고 그곳에서 결국 분리된다"],["from the face of the structure.","구조물의 표면으로부터"]],"g":"바람은 평평한 앞면을 밀고 옆으로 돌아 흐르다가, 결국 건물 표면에서 떨어져 나간다."},{"ck":[["( ①) The difference in pressures","( ①) 압력의 차이는"],["on the front and back faces of the building","건물의 앞면과 뒷면에 가해지는"],["gives rise to vortices,","회오리를 발생시킨다"],["or spinning currents of wind,","즉 회전하는 기류를"],["that flow downstream from the building.","건물에서 하류로 흐르는"]],"g":"앞뒤 면의 압력 차가 회오리, 곧 건물 뒤로 흘러가는 회전 기류를 만들어 낸다."},{"ck":[["( ②) The vortices pull and push the building","( ②) 그 회오리는 건물을 당기고 민다"],["in a direction perpendicular to the wind","바람과 직각인 방향으로"],["at frequencies","어떤 진동수로"],["that can become dangerously self-sustaining.","위험할 정도로 스스로 유지될 수 있는"]],"g":"회오리는 바람과 <b>직각 방향</b>으로 건물을 흔드는데, 그 진동이 스스로 커져 위험해질 수 있다."},{"ck":[["( ③) Orienting the building","( ③) 건물의 방향을 잡는 것이"],["so that the longer face of the structure","구조물의 더 긴 면이"],["is parallel with prevailing winds","주로 부는 바람과 평행하도록"],["can help.","도움이 될 수 있다"]],"g":"긴 면이 주풍향과 나란해지도록 건물을 앉히면 도움이 된다."},{"ck":[["( ④) Chopping or rounding off corners of a building","( ④) 건물 모서리를 잘라 내거나 둥글게 하는 것도"],["can likewise make it more aerodynamic.","마찬가지로 그것을 더 공기역학적으로 만들 수 있다"]],"g":"모서리를 잘라 내거나 둥글리는 것도 마찬가지로 공기 흐름을 좋게 한다."},{"ck":[["( ⑤) Roughing up the corners of the building","( ⑤) 건물의 모서리를 거칠게 만드는 것은"],["through the careful placement of balconies or stepped corners","발코니나 계단식 모서리를 신중히 배치하여"],["can help by disturbing or delaying","방해하거나 지연시킴으로써 도움이 될 수 있다"],["the formation of strong vortices.","강한 회오리의 형성을"]],"g":"발코니나 계단식 모서리로 모서리를 거칠게 만들면 강한 회오리가 만들어지는 것을 방해하거나 늦출 수 있다."}],"theme":"초고층 빌딩과 <b>바람</b>의 싸움이다. 비용을 줄이고 수익을 키우려다 보니 건물은 대개 사각형이 되는데, 이는 공기역학적이지 않아 <b>와류 방출(vortex shedding)</b>을 일으킨다. 바람이 평평한 면을 밀고 옆으로 흐르다 떨어져 나가면서 앞뒤 압력 차가 생기고, 그 회오리가 바람과 <b>직각 방향</b>으로 건물을 밀고 당기는데 그 진동수가 위험하게 스스로 커질 수 있다. 그래서 설계자들은 바람을 <b>헷갈리게</b> 만든다 — 긴 면을 주풍향과 나란히 두고, 모서리를 자르거나 둥글게 하고, 발코니·계단식 모서리로 모서리를 거칠게 해 회오리 형성을 방해한다.","why":"①②는 <b>문제</b>(압력 차 → 회오리 → 위험한 진동)를 설명하고, ③부터는 <i>can help</i>, <i>likewise</i>가 이어지는 <b>해법</b>입니다. 주어진 문장은 '와류를 줄이려고 설계자들이 바람을 교란한다'는 <b>해법의 총론</b>이므로, 문제 설명이 끝나고 개별 해법이 시작되기 직전인 <b>③</b>에 들어갑니다.","rub":[["① 네모난 초고층 빌딩","초고층 · 빌딩 · 건물 · 네모 · 사각 · 직사각"],["② 와류가 건물을 흔듦","와류 · 회오리 · 소용돌이 · 바람 · 흔들 · 진동 · 위험"],["③ 형태를 바꿔 바람을 교란","모서리 · 둥글 · 자르 · 방향 · 평행 · 발코니 · 교란 · 방해 · 줄이"]],"dic":{"minimize":{"p":"미니마이즈","k":"최소화하다"},"vortex":{"p":"볼텍스","k":"회오리, 소용돌이 (각주)"},"vortex shedding":{"p":"볼텍스 셰딩","k":"와류 방출"},"skyscraper":{"p":"스카이스크뤠이펄","k":"초 ted populations. → By lowering the cost of pharmaceutical research and development, AI can help reduce the imbalance in investment that has led to the _____ (A) of less profitable diseases, thereby broadening the focus of medical research to include _____ (B) populations.","ch":["prevention……marginalized","spread ……general","overlook ……native","ignorance……wealthy","disregard ……underserved"],"ans":5,"pts":2,"foot":[{"word":"offset","gloss":"상쇄하다"},{"word":"demographic","gloss":"인구 집단"}],"needImg":false,"sents":[{"ck":[["In the pharmaceutical industry,","제약 산업에서는"],["algorithms are being employed","알고리즘이 활용되고 있다"],["to find treatments and drugs for rare diseases","희귀 질병의 치료법과 약을 찾기 위해"],["that to date haven't received much attention.","지금까지 큰 관심을 받지 못했던"]],"g":"제약 산업에서는 그동안 외면받던 희귀 질병의 치료법과 약을 찾는 데 알고리즘이 쓰이고 있다."},{"ck":[["The hard truth has always been","냉혹한 진실은 언제나 ~였다"],["that pharma devotes more research and development resources","제약사가 더 많은 연구개발 자원을 쏟는다는 것"],["to diseases that affect the rich.","부유한 사람들이 걸리는 질병에"]],"g":"냉정한 사실은, 제약사가 <b>부자가 걸리는 병</b>에 연구개발 자원을 더 붓는다는 것이다."},{"ck":[["The definition of rare","'희귀하다'는 것의 정의는"],["has too often been associated with poor","너무나 자주 가난과 연결되어 왔다"],["― that is, even if a disease is quite prevalent","― 즉 어떤 질병이 꽤 널리 퍼져 있어도"],["in a population that cannot afford to pay for it","그 비용을 감당할 수 없는 인구 집단에서"],["(for example, people living in the developing world),","(예를 들어 개발도상국에 사는 사람들),"],["the disease has been neglected","그 질병은 등한시되어 왔다"],["compared to First World illnesses.","선진국 질환에 비해"]],"g":"'희귀'는 사실상 '가난'과 붙어 다녔다 — 개발도상국에 아무리 흔해도, 값을 못 치르면 선진국 질환에 밀려 <b>방치</b>됐다."},{"ck":[["By lowering the cost of data collection, mining, and analysis","데이터 수집·마이닝·분석 비용을 낮춤으로써"],["in drug development and clinical trials,","신약 개발과 임상시험에서"],["AI can help offset imbalances","AI는 불균형을 상쇄하도록 도울 수 있다"],["in the pharmaceutical industry","제약 산업의"],["that direct attention to diseases that \"pay,\"","'돈이 되는' 질병으로 관심을 돌리게 하는"],["whether because the disease is more common","그 질병이 더 흔해서든"],["or because it is prevalent among demographics that can pay more.","혹은 더 많이 낼 수 있는 집단에 널리 퍼져서든"]],"g":"AI가 데이터와 임상시험 비용을 낮추면, '<b>돈 되는</b>' 병에만 관심이 쏠리게 만든 제약 산업의 불균형을 상쇄할 수 있다."},{"ck":[["We see the democratizing power of AI","우리는 AI의 민주화하는 힘을 본다"],["to broaden the attention","관심을 넓히는"],["of the medical and research communities","의료계와 연구계의"],["to find cures to traditionally neglected health issues","전통적으로 외면된 건강 문제의 치료법을 찾도록"],["and among traditionally neglected populations.","그리고 전통적으로 외면된 사람들 사이에서"]],"g":"AI의 <b>민주화하는 힘</b>이 의료·연구계의 시야를 오래 외면받은 질병과 사람들에게로 넓혀 준다."},{"ck":[["→ By lowering the cost of pharmaceutical research and development,","→ 제약 연구개발 비용을 낮춤으로써"],["AI can help reduce the imbalance in investment","AI는 투자 불균형을 줄이도록 도울 수 있다"],["that has led to the _____ (A) of less profitable diseases,","수익성이 낮은 질병에 대한 _____(A)를 낳았던"],["thereby broadening the focus of medical research","그리하여 의학 연구의 초점을 넓혀"],["to include _____ (B) populations.","_____(B) 사람들까지 포함하도록"]],"g":"→ 연구개발 비용을 낮춤으로써 AI는 수익성 낮은 질병을 <b>무시(disregard)</b>하게 만든 투자 불균형을 줄이고, 의학 연구의 초점을 <b>혜택에서 소외된(underserved)</b> 사람들까지 넓힌다."}],"theme":"제약 산업의 <b>불균형을 AI가 줄일 수 있다</b>는 글이다. 제약사는 늘 <b>돈 되는 병</b>, 즉 부유층이 걸리는 질병에 연구개발 자원을 더 쏟아 왔다. '희귀병'이라는 말은 사실상 '가난한 사람의 병'과 붙어 다녔다 — 개발도상국에 아무리 흔한 병이라도 값을 치를 수 없으면 선진국 질환에 밀려 방치됐다. AI가 데이터 수집·분석과 임상시험 비용을 낮추면, '<b>돈이 되는</b>' 질병 쪽으로만 관심이 쏠리게 만든 그 불균형을 상쇄할 수 있다. 그래서 의료·연구계의 관심이 <b>전통적으로 소외된</b> 질병과 사람들에게로 넓어진다.","why":"(A)는 '수익성이 낮은 질병에 대한 <u>____</u>를 낳은 투자 불균형'입니다. 본문의 <i>neglected</i>(방치·등한시)를 받아야 하므로 <b>disregard(무시)</b>. (B)는 '연구의 초점을 <u>____</u> 사람들에게로 넓힌다'이므로 <i>traditionally neglected populations</i>를 받는 <b>underserved(충분한 혜택을 못 받는)</b>. 답은 ⑤. ④ ignorance는 '무지'라 뜻이 어긋나고, wealthy는 방향이 반대입니다.","rub":[["① 돈 되는 병에 쏠린 연구","돈 · 수익 · 부유 · 부자 · 선진국 · 쏠 · 편중 · 불균형"],["② 가난한 쪽 질병은 방치","가난 · 개발도상국 · 희귀 · 방치 · 무시 · 소외 · 외면"],["③ AI가 비용을 낮춰 넓힘","AI · 알고리즘 · 비용 · 낮 · 줄 · 넓 · 확대 · 관심 · 민주화"]],"dic":{"pharmaceutical":{"p":"팔머쑤리컬","k":"제약의"},"a hous solid,\" for others a \"supercooled liquid.\" In theory it's both liquid and solid, though, given the way it behaves, in practice it's really the latter. In fact, at room temperature glass never behaves as a (a) liquid, even an imperceptibly viscous one, even over long periods of time (though it can \"sweat\" if you don't add enough lime to the mix). Those (b) misshapen sheets of glass you sometimes see in old stained-glass windows, thicker at the bottom than the top, are generally not that way because the glass is slowly sinking over time. Unless the church has endured temperatures of more than 400˚C, the chances are they are uneven because that's the way they were blown and (c) solidified in the first place. Flat glass was only developed in the nineteenth century and we had to wait until the middle of the twentieth century for truly flat, thin sheets of glass. The (d) paradox is that, despite it being one of the very oldest human-made substances, scientists still struggle to comprehend why glass behaves the way it does. Glass seems to (e) obey most molecular laws. As one glassmaker put it, glass is not a material; it's a state.","ch":["Unsolved Mystery Behind the Nature of Glass","Solid and Liquid Glass: Their Respective Uses","A Scientific Perspective on Problems with Stained Glass","Puzzling Glass: Why Solid but Easily Breakable?","Techniques for Producing Truly Flat Glass"],"ans":1,"pts":2,"foot":[{"word":"molecular","gloss":"분자의"},{"word":"amorphous","gloss":"무정형(無定形)의"},{"word":"viscous","gloss":"들러붙는"}],"needImg":false,"sents":[{"ck":[["The structure of glass is, frankly,","유리의 구조는 솔직히 말해"],["a bit of a mess.","다소 엉망진창이다"]],"g":"유리의 구조는 솔직히 좀 엉망이다."},{"ck":[["Clear and perfect as it might appear to our eyes,","우리 눈에는 맑고 완벽해 보일지 몰라도"],["down at the molecular level,","분자 수준으로 내려가면"],["glass looks more like a random ball-pit of atoms.","유리는 원자들의 마구잡이 볼풀에 더 가까워 보인다"]],"g":"눈에는 맑고 완벽해 보여도, 분자 수준에서 유리는 원자들이 뒤엉킨 볼풀에 가깝다."},{"ck":[["The technical term for this iquid.\" In theory it's both liquid and solid, though, given the way it behaves, in practice it's really the latter. In fact, at room temperature glass never behaves as a (a) liquid, even an imperceptibly viscous one, even over long periods of time (though it can \"sweat\" if you don't add enough lime to the mix). Those (b) misshapen sheets of glass you sometimes see in old stained-glass windows, thicker at the bottom than the top, are generally not that way because the glass is slowly sinking over time. Unless the church has endured temperatures of more than 400˚C, the chances are they are uneven because that's the way they were blown and (c) solidified in the first place. Flat glass was only developed in the nineteenth century and we had to wait until the middle of the twentieth century for truly flat, thin sheets of glass. The (d) paradox is that, despite it being one of the very oldest human-made substances, scientists still struggle to comprehend why glass behaves the way it does. Glass seems to (e) obey most molecular laws. As one glassmaker put it, glass is not a material; it's a state.","ch":[],"ans":5,"pts":3,"foot":[{"word":"molecular","gloss":"분자의"},{"word":"amorphous","gloss":"무정형(無定形)의"},{"word":"viscous","gloss":"들러붙는"}],"needImg":false,"sents":[{"ck":[["The structure of glass is, frankly,","유리의 구조는 솔직히 말해"],["a bit of a mess.","다소 엉망진창이다"]],"g":"유리의 구조는 솔직히 좀 엉망이다."},{"ck":[["Clear and perfect as it might appear to our eyes,","우리 눈에는 맑고 완벽해 보일지 몰라도"],["down at the molecular level,","분자 수준으로 내려가면"],["glass looks more like a random ball-pit of atoms.","유리는 원자들의 마구잡이 볼풀에 더 가까워 보인다"]],"g":"눈에는 맑고 완벽해 보여도, 분자 수준에서 유리는 원자들이 뒤엉킨 볼풀에 가깝다."},{"ck":[["The technical term for this mess","이 엉망진창을 가리키는 전문 용어는"],["depends on who you're asking:","누구에게 묻느냐에 달렸다"],["for some scientists it is an \"amorphous solid,\"","어떤 과학자에게는 '무정형 고체'이고"],["for others a \"supercooled liquid.\"","다른 이들에게는 '과냉각 액체'이다"]],"g":"부르는 이름부터 갈린다 — 누구는 '무정형 고체', 누구는 '과냉각 액체'라 한다."},{"ck":[["In theory it's both liquid and solid,","이론상 그것은 액체이면서 고체이다"],["though, given the way it behaves,","하지만 그것이 행동하는 방식을 보면"],["in practice it's really the latter.","실제로는 정말로 후자이다"]],"g":"이론상으론 액체이자 고체지만, 실제로 구는 걸 보면 <b>고체</b> 쪽이다."},{"ck":[["In fact, at room temperature","사실 상온에서"],["glass never behaves as a (a) liquid,","유리는 결코 액체처럼 행동하지 않는다"],["even an imperceptibly viscous one,","알아차릴 수 없을 만큼 들러붙는 액체라 해도"],["even over long periods of time","아주 오랜 시간이 지나도"],["(though it can \"sweat\"","(다만 '땀을 흘릴' 수는 있다"],["if you don't add enough lime to the mix).","혼합물에 석회를 충분히 넣지 않으면)"]],"g":"상온의 유리는 아무리 오래 둬도 액체처럼 굴지 않는다 — 석회가 모자라면 '땀'을 흘릴 수는 있지만."},{"ck":[["Those (b) misshapen sheets of glass","가끔 보이는 그 보기 흉한 유리판들은"],["you sometimes see in old stained-glass windows,","오래된 스테인드글라스 창에서"],["thicker at the bottom than the top,","위쪽보다 아래쪽이 더 두꺼운"],["are generally not that way","대개 그렇게 된 것이 아니다"],["because the glass is slowly sinking over time.","유리가 시간이 지나며 천천히 가라앉기 때문에"]],"g":"오래된 스테인드글라스에서 아래가 두꺼운 유리판은, 유리가 흘러내려서 그런 것이 <b>아니다.</b>"},{"ck":[["Unless the church has endured temperatures","교회가 온도를 견뎌 낸 것이 아니라면"],["of more than 400˚C,","400도가 넘는"],["the chances are they are uneven","아마 그것들이 고르지 않은 것은"],["because that's the way they were blown","그런 방식으로 불어서 만들어지고"],["and (c) solidified in the first place.","애초에 그렇게 굳었기 때문이다"]],"g":"교회가 400도를 견딘 게 아니라면, 그 유리가 고르지 않은 건 <b>처음부터 그렇게 불려 굳었기</b> 때문이다."},{"ck":[["Flat glass was only developed in the nineteenth century","평판 유리는 19세기에야 겨우 개발되었다"],["and we had to wait until the middle of the twentieth century","그리고 우리는 20세기 중반까지 기다려야 했다"],["for truly flat, thin sheets of glass.","정말로 평평하고 얇은 유리판을 얻기까지"]],"g":"평판 유리는 19세기에야 나왔고, 진짜 평평하고 얇은 판은 20세기 중반에야 가능했다."},{"ck":[["The (d) paradox is that,","역설은 ~라는 것이다"],["despite it being one of the very oldest human-made substances,","그것이 인간이 만든 가장 오래된 물질 중 하나인데도"],["scientists still struggle to comprehend","과학자들이 여전히 이해하려 애쓰고 있다는"],["why glass behaves the way it does.","왜 유리가 그렇게 행동하는지를"]],"g":"<b>역설</b>은, 인간이 만든 가장 오래된 물질 중 하나인데도 왜 그렇게 구는지 아직 모른다는 것이다."},{"ck":[["Glass seems to (e) obey","유리는 따르는 것처럼 보인다"],["most molecular laws.","대부분의 분자 법칙을"]],"g":"유리는 대부분의 분자 법칙을 <b>따르는(→ 거부하는)</b> 것처럼 보인다."},{"ck":[["As one glassmaker put it,","한 유리 제조업자가 말했듯이"],["glass is not a material; it's a state.","유리는 재료가 아니라 상태이다"]],"g":"한 유리 장인의 말처럼, 유리는 <b>재료가 아니라 상태</b>다."}],"theme":"41번과 <b>같은 지문</b>이다. 이 문항은 (a)~(e) 중 문맥에 안 맞는 낱말을 찾는다. 글의 뼈대는 '유리는 정체가 모호하고, 통념(유리가 흘러내린다)은 틀렸으며, 가장 오래된 물질인데도 <b>아직 이해되지 않는다</b>'이다.","why":"(e) 앞 문장이 결정적입니다 — '<b>가장 오래된 물질인데도 왜 그렇게 구는지 아직 이해하지 못한다</b>'는 역설을 말한 직후입니다. 그렇다면 유리는 분자 법칙을 <i>obey</i>(따르는) 게 아니라 <b>defy</b>(거스르는) 것처럼 보여야 앞뒤가 맞습니다. 답은 ⑤. (a) liquid, (b) misshapen, (c) solidified, (d) paradox는 모두 문맥에 맞습니다.","rub":[["① 유리의 정체가 모호","유리 · 고체 · 액체 · 무정형 · 과냉각 · 모호 · 둘 다"],["② 통념은 틀림","가라앉 · 흘러내 · 아니 · 오해 · 통념 · 처음부터"],["③ 법칙을 거스름 → 미해결","거스 · 거부 · 어긋 · 법칙 · 모른 · 이해 못 · 역설 · 수수께끼"]],"dic":{"structure":{"p":"스트뤅철","k":"구조"},"frankly":{"p":"프뢩클리","k":"솔직히"},"a bit of a mess":{"p":"어 빗 오브 어 메스","k":"다소 엉망인 것"},"molecular":{"p":"멀레큘럴","k":"분자의 (각주)"},"random":{"p":"뢘덤","k":"마구잡이의, 무작위의"},"ball-pit":{"p":"볼 핏","k":"볼풀(공 놀이터)"},"atom":{"p":"애럼","k":"원자"},"technical term":{"p":"테크니컬 텀","k":"전문 용어"},"amorphous":{"p":"어몰퍼스","k":"무정형의 (각주)"},"solid":{"p":"쌀리드","k":"고체"},"supercooled":{"p":"쑤펄쿨드","k":"과냉각된"},"liquid":{"p":"리퀴드","k":"액체"},"in theory":{"p":"인 씨어뤼","k":"이론상"},"given":{"p":"기븐","k":"~을 고려하면"},"behave":{"p":"비헤이브","k":"행동하다, 거동하다"},"in practice":{"p":"인 프뢕티스","k":"실제로는"},"the latter":{"p":"더 래럴","k":"후자"},"room temperature":{"p":"룸 템퍼뤄철","k":"상온"},"imperceptibly":{"p":"임펄쎕터블리","k":"알아차릴 수 없을 만큼"},"viscous":{"p":"비스커스","k":"들러붙는, 점성이 있는 (각주)"},"lime":{"p":"라임","k":"석회"},"misshapen":{"p":"미스셰이픈","k":"보기 흉한, 모양이 일그러진"},"stained-glass":{"p":"스테인드 글래스","k":"스테인드글라스의"},"sink":{"p":"씽크","k":"가라앉다"},"endure":{"p":"인듀얼","k":"견디다"},"the chances are":{"p":"더 챈씨즈 알","k":"아마 ~일 것이다"},"uneven":{"p":"언이븐","k":"고르지 않은"},"blow":{"p":"블로우","k":"(유리를) 불어서 만들다"},"solidify": st have no musical talent.\" Sally looked back to the old woman sadly and told (c) her the story. The old woman winked, handed the violin to Sally, and said, \"You don't need talent to enjoy playing.\" Feeling brave, Sally accepted the instrument and tried playing. The sound was rough, and she felt embarrassed. But the old woman just smiled and said, \"That's how it begins. (d) I hope to see you again tomorrow.\" (D) \"Hello! Are you going to listen to my performance?\" the old woman looked up and asked. Sally laughed and replied, \"Oh sorry, I was just passing by.\" (e) She turned to continue walking home, but decided to stop for a bit and listen. After the woman's music finished, Sally asked her when she had started playing the violin. \"I just started last year, but I always wanted to learn,\" the woman answered. Sally was impressed by her response. Even though she loved listening to music, she could not play any instruments well.","ch":["(B) - (D) - (C)","(C) - (B) - (D)","(C) - (D) - (B)","(D) - (B) - (C)","(D) - (C) - (B)"],"ans":5,"pts":2,"foot":[],"needImg":false,"sents":[{"ck":[["(A) Every day after school,","(A) 방과 후 매일"],["Sally walked home through the park.","Sally는 공원을 가로질러 집으로 걸어갔다"]],"g":"(A) 방과 후면 Sally는 늘 공원을 가로질러 집으로 걸어갔다."},{"ck":[["She liked listening to music in her headphones","그녀는 헤드폰으로 음악 듣는 것을 좋아했다"],["and looking at the trees on her way home.","그리고 집에 가는 길에 나무를 보는 것을"]],"g":"헤드폰으로 음악을 듣고 길가의 나무를 바라보는 걸 좋아했다."},{"ck":[["One day, while she was changing songs,","어느 날 그녀가 노래를 바꾸고 있을 때"],["she heard strange, unpolished music.","그녀는 이상하고 다듬어지지 않은 음악을 들었다"]],"g":"어느 날 곡을 바꾸다가, 이상하고 <b>서툰</b> 음악 소리를 들었다."},{"ck":[["She took off her headphones","그녀는 헤드폰을 벗었다"],["and followed the music through the park.","그리고 공원을 가로질러 그 음악을 따라갔다"]],"g":"헤드폰을 벗고 소리를 따라 공원을 가로질러 갔다."},{"ck":[["She saw a kind-looking old woman","그녀는 친절해 보이는 노부인을 보았다"],["sitting on a small bench","작은 벤치에 앉아"],["and playing the violin.","바이올린을 연주하고 있는"]],"g":"작은 벤치에 앉아 바이올린을 켜는 인상 좋은 노부인이 oman sitting on a small bench and playing the violin. While (a) her music wasn't perfect, there was something warm and welcoming about it. So, Sally walked closer. (B) The following day, they met at the same bench. Sally was happy to hear the old woman's music again, but when she sat, the woman stopped playing. \"Today is your first full lesson,\" she said as she handed the violin to Sally. (b) She showed the young woman how to place her fingers on the strings. After an hour, she had learned some basics. Then, the old woman played the same music from the day before. Sally promised to meet her every day and started walking home. As she walked, simple, unpolished music was playing in her mind. (C) The old woman asked Sally if she played any instruments. Suddenly, Sally remembered learning the recorder from her older sister Beatrice when she was a girl. Beatrice had said, \"You just have no musical talent.\" Sally looked back to the old woman sadly and told (c) her the story. The old woman winked, handed the violin to Sally, and said, \"You don't need talent to enjoy playing.\" Feeling brave, Sally accepted the instrument and tried playing. The sound was rough, and she felt embarrassed. But the old woman just smiled and said, \"That's how it begins. (d) I hope to see you again tomorrow.\" (D) \"Hello! Are you going to listen to my performance?\" the old woman looked up and asked. Sally laughed and replied, \"Oh sorry, I was just passing by.\" (e) She turned to continue walking home, but decided to stop for a bit and listen. After the woman's music finished, Sally asked her when she had started playing the violin. \"I just started last year, but I always wanted to learn,\" the woman answered. Sally was impressed by her response. Even though she loved listening to music, she could not play any instruments well.","ch":["(a)","(b)","(c)","(d)","(e)"],"ans":5,"pts":2,"foot":[],"needImg":false,"sents":[{"ck":[["(A) Every day after school,","(A) 방과 후 매일"],["Sally walked home ed and replied, \"Oh sorry, I was just passing by.\" (e) She turned to continue walking home, but decided to stop for a bit and listen. After the woman's music finished, Sally asked her when she had started playing the violin. \"I just started last year, but I always wanted to learn,\" the woman answered. Sally was impressed by her response. Even though she loved listening to music, she could not play any instruments well.","ch":["Sally는 헤드폰으로 음악을 듣는 것을 좋아했다.","노부인의 연주를 다시 듣게 되어 Sally는 행복했다.","Sally는 노부인을 매일 만나기로 약속했다.","Beatrice는 Sally의 음악적 재능을 칭찬했다.","노부인은 항상 바이올린을 배우고 싶어 했다."],"ans":4,"pts":2,"foot":[],"needImg":false,"sents":[{"ck":[["(A) Every day after school,","(A) 방과 후 매일"],["Sally walked home through the park.","Sally는 공원을 가로질러 집으로 걸어갔다"]],"g":"(A) 방과 후면 Sally는 늘 공원을 가로질러 집으로 걸어갔다."},{"ck":[["She liked listening to music in her headphones","그녀는 헤드폰으로 음악 듣는 것을 좋아했다"],["and looking at the trees on her way home.","그리고 집에 가는 길에 나무를 보는 것을"]],"g":"헤드폰으로 음악을 듣고 길가의 나무를 바라보는 걸 좋아했다."},{"ck":[["One day, while she was changing songs,","어느 날 그녀가 노래를 바꾸고 있을 때"],["she heard strange, unpolished music.","그녀는 이상하고 다듬어지지 않은 음악을 들었다"]],"g":"어느 날 곡을 바꾸다가, 이상하고 <b>서툰</b> 음악 소리를 들었다."},{"ck":[["She took off her headphones","그녀는 헤드폰을 벗었다"],["and followed the music through the park.","그리고 공원을 가로질러 그 음악을 따라갔다"]],"g":"헤드폰을 벗고 소리를 따라 공원을 가로질러 갔다."},{"ck":[["She saw a kind-looking old woman","그녀는 친절해 보이는 노부인을 보았다"],["sitting on a small bench","작은 벤치에 앉아"],["and playing the violin.","바이올린을 연주하고 있는"]],"g":"작은 벤치에 앉아 바이올린을 켜는 인상 좋은 노부인이 있었다."},{"ck":[["While (a) her music wasn't perfect,","(a) 그녀의 음악은 완벽하지 않았지만"],["there was something warm and welcoming about it.","거기에는 따뜻하고 마음을 끄는 무언가가 있었다"]],"g":"연주는 완벽하지 않았지만 어딘가 따뜻하고 사람을 끄는 데가 있었다."},{"ck":[["So, Sally walked closer.","그래서 Sally는 더 가까이 걸어갔다"]],"g":"그래서 Sally는 더 가까이 다가갔다."},{"ck":[["(B) The following day,","(B) 그 다음 날"],["they met at the same bench.","그들은 같은 벤치에서 만났다"]],"g":"(B) 다음 날 두 사람은 같은 벤치에서 만났다."},{"ck":[["Sally was happy to h var MANY = true;

/* ---------- 저장 ---------- */
var KEY = "go3read";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
var ST = load();
function rec(id){ if(!ST[id]) ST[id]={round:1,unk:[],a1:null,a2:null,trans:{},sum:"",cause:"",sec:0}; return ST[id]; }

/* ---------- 시계: 손이 멈추면 멈춘다 ---------- */
var cur=null, tick=null, idle=0;
function startClock(){
  stopClock();
  tick=setInterval(function(){
    idle++;
    if(idle<=60){ var r=rec(cur.id); r.sec++; save(ST); }
    var t=document.getElementById("timer"); if(!t) return;
    var s=rec(cur.id).sec, m=Math.floor(s/60);
    t.textContent=m+":"+String(s%60).padStart(2,"0");
    t.className="timer"+(idle>60?" rest":"");
    if(idle>60) t.textContent+=" 쉬는 중";
  },1000);
}
function stopClock(){ if(tick){clearInterval(tick);tick=null;} }
["pointerdown","keydown","input"].forEach(function(ev){
  document.addEventListener(ev,function(){ idle=0; },true);
});

/* ---------- 소리 ---------- */
function speak(w){
  try{ var u=new SpeechSynthesisUtterance(w); u.lang="en-US"; u.rate=.85;
       speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){}
}

/* ---------- 지문 글자 만들기 ---------- */
function esc(t){ return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function markup(txt){
  var out="", re=/([A-Za-z][A-Za-z'’\-]*)|(_____)|([①②③④⑤])|(\([a-eA-D]\))|([\s\S])/g, m;
  while((m=re.exec(txt))){
    if(m[1]) out+='<span class="w" data-w="'+m[1].toLowerCase()+'">'+esc(m[1])+'</span>';
    else if(m[2]) out+='<span class="blank"></span>';
    else if(m[3]) out+='<span class="mk">'+m[3]+'</span>';
    else if(m[4]) out+='<span class="'+(/[A-D]/.test(m[4])?'sec':'mkl')+'">'+m[4]+'</span>';
    else out+=esc(m[5]);
  }
  return out;
}
var CIRC="①②③④⑤";

/* ---------- 화면 ---------- */
function go(id){
  cur=DATA.filter(function(d){return d.id===id;})[0];
  location.hash=id; render(); window.scrollTo(0,0);
}
function listView(){
  stopClock(); cur=null; location.hash="";
  document.getElementById("hpill").textContent="";
  document.getElementById("timer").textContent="";
  var by={};
  DATA.forEach(function(d){ var k=d.y+"년 "+d.m+"월"; (by[k]=by[k]||[]).push(d); });
  var h='<h1>고3 해석 도전</h1><p class="sub">지문 '+DATA.length+'개 · 한 지문을 세 번 만난다</p>';
  Object.keys(by).forEach(function(k){
    h+='<h2 style="font-size:16px;margin:22px 0 4px">'+k+'</h2><div class="list">';
    by[k].forEach(function(d){
      var r=ST[d.id], done=r&&r.round>3;
      h+='<a href="javascript:go(\''+d.id+'\')"><b>'+d.q+'번</b> · '+d.type+
         (done?' <span style="color:#166534">✔ 끝</span>':(r?' <span style="color:#b45309">'+r.round+'차 진행 중</span>':''))+'</a>';
    });
    h+='</div>';
  });
  document.getElementById("app").innerHTML=h;
}
function render(){
  var d=cur, r=rec(d.id);
  document.getElementById("hpill").textContent=d.y+"."+d.m+" "+d.q+"번 "+d.type;
  document.getElementById("htitle").innerHTML= MANY
    ? '<a href="javascript:listView()" style="color:inherit;text-decoration:none">← 목록</a>'
    : '고３ 해석 도전';
  var h='<div class="step">'+
    [1,2,3].map(function(n){
      var c = r.round>n ? "done" : (r.round===n?"on":"");
      return '<div class="'+c+'">'+n+'차 '+["사전 잠김","사전 열림","정답 확인"][n-1]+'</div>';
    }).join("")+'</div>';
  if(r.round===1) h+=round1(d,r);
  else if(r.round===2) h+=round2(d,r);
  else h+=round3(d,r);
  document.getElementById("app").innerHTML=h;
  bindWords();
  startClock();
}

function head(d){
  var h='<p class="sub" style="margin:10px 0 6px">'+esc(d.instr)+'</p>';
  if(d.needImg) h+='<div class="warn">이 문항은 도표 그래프가 필요합니다. 종이 문제지를 함께 보세요.</div>';
  if(d.given) h+='<div class="given">'+markup(d.given)+'</div>';
  return h;
}
function choices(d,r,sel,reveal,lock){
  if(!d.ch.length) return '<p class="sub">번호를 고르세요 (본문의 ①~⑤ 위치)</p>'+
    [1,2,3,4,5].map(function(n){
      var c="ch"+(sel===n?" sel":"")+(reveal?(n===d.ans?" ok":(sel===n?" no":"")):"");
      return '<button class="'+c+'" '+(lock?"disabled":"")+' onclick="pick('+n+')"><span class="n">'+CIRC[n-1]+'</span></button>';
    }).join("");
  return d.ch.map(function(t,i){
    var n=i+1, c="ch"+(sel===n?" sel":"")+(reveal?(n===d.ans?" ok":(sel===n?" no":"")):"");
    return '<button class="'+c+'" '+(lock?"disabled":"")+' onclick="pick('+n+')"><span class="n">'+CIRC[i]+'</span>'+esc(t)+'</button>';
  }).join("");
}

/* ---- 1차 : 사전 잠김 ---- */
function round1(d,r){
  return head(d)+
   '<div class="card"><div class="psg" id="psg">'+markup(d.psg)+'</div>'+
   (d.foot.length?'<p class="foot">'+d.foot.map(function(f){return "*"+esc(f.word)+": "+esc(f.gloss);}).join(" · ")+'</p>':'')+
   '</div>'+
   '<p class="sub">모르는 단어를 눌러 표시해 두세요. <b>뜻은 아직 안 뜹니다.</b> 시험장처럼 넘어가며 푸세요.</p>'+
   choices(d,r,r.a1,false,false)+
   '<button class="btn" id="go1" onclick="submit1()" '+(r.a1?"":"disabled")+'>1차 제출하고 2차로</button>';
}
function submit1(){ var r=rec(cur.id); if(!r.a1) return; r.round=2; save(ST); render(); window.scrollTo(0,0); }

/* ---- 2차 : 사전 열림 ---- */
function round2(d,r){
  var h=head(d)+
   '<div class="card"><div class="psg" id="psg">'+markup(d.psg)+'</div></div>'+
   '<p class="sub">이제 단어를 누르면 <b>뜻이 뜹니다.</b> 1차에 표시한 단어엔 색이 남아 있습니다.</p>'+
   '<div class="lab">문장별 해석 — 쓸 수 있는 만큼만 쓰세요</div>';
  d.sents.forEach(function(s,i){
    var en=s.ck.map(function(c){return c[0];}).join(" ");
    h+='<div class="sb"><div class="sn">'+(i+1)+'</div><div style="font-family:Georgia,serif">'+markup(en)+'</div>'+
       '<textarea data-i="'+i+'" placeholder="여기에 해석을 쓰세요 (S펜으로 써도 글자로 바뀝니다)">'+esc(r.trans[i]||"")+'</textarea></div>';
  });
  h+='<div class="lab">같은 문제를 다시 풀어 보세요 (1차 답은 잠겨 있습니다)</div>'+
     '<p class="sub">1차에 고른 답: <b>'+CIRC[r.a1-1]+'</b></p>'+
     choices(d,r,r.a2,false,false)+
     '<button class="btn" onclick="submit2()" '+(r.a2?"":"disabled")+'>2차 제출하고 정답 확인</button>';
  return h;
}
function submit2(){
  var r=rec(cur.id);
  document.querySelectorAll("textarea[data-i]").forEach(function(t){ r.trans[t.dataset.i]=t.value; });
  if(!r.a2) return;
  r.round=3; save(ST); render(); window.scrollTo(0,0);
}

/* ---- 3차 : 정답 확인 ---- */
function judge(sum,rub){
  var s=(sum||"").replace(/\s/g,"");
  return rub.map(function(row){
    return row[1].split("·").some(function(k){ k=k.trim().replace(/\s/g,""); return k && s.indexOf(k)>=0; });
  });
}
function round3(d,r){
  var ok1=r.a1===d.ans, ok2=r.a2===d.ans;
  var v = ok1&&ok2 ? ["v1","확실히 안다","난도를 올려도 됩니다."]
        : (!ok1&&ok2 ? ["v2","어휘 때문에 틀렸다","독해력 문제가 아닙니다. 단어장으로 해결됩니다."]
        : (ok1&&!ok2 ? ["v2","1차는 찍었을 가능성","실력으로 오해하면 안 되는 구간입니다."]
        : ["v3","독해·논리의 문제","단어를 외워도 안 오릅니다. 선생님과 함께 봐야 합니다."]));
  var hits=judge(r.sum,d.rub), n=hits.filter(Boolean).length;
  var h=head(d)+
   '<div class="verdict '+v[0]+'">1차 '+(ok1?"○":"✕")+' · 2차 '+(ok2?"○":"✕")+' → '+v[1]+'<br>'+
   '<span style="font-weight:400;font-size:14px">'+v[2]+'</span></div>'+
   '<div class="card"><div class="psg">'+markup(d.psg)+'</div></div>'+
   choices(d,r,r.a2,true,true)+
   '<div class="lab">줄거리 · 주제</div><div class="card">'+d.theme+'</div>'+
   (d.why?'<p class="sub">'+d.why+'</p>':'')+
   '<div class="lab">슬래시 해석</div>';
  d.sents.forEach(function(s,i){
    h+='<div class="sb"><div class="sn">'+(i+1)+'</div><div>'+
       s.ck.map(function(c){return '<span class="ck"><span class="en">'+esc(c[0])+'</span><span class="ko">'+
         (c===s.ck[0]?"":"/ ")+esc(c[1])+'</span></span>';}).join("")+
       '</div><div class="gl">'+s.g+'</div>'+
       (r.trans[i]?'<div class="sub" style="margin-top:6px">내가 쓴 해석 · '+esc(r.trans[i])+'</div>':'')+
       '</div>';
  });
  h+='<div class="lab">한 줄 요약 — 지문을 덮고 15~40자로</div>'+
     '<textarea id="sum" oninput="reJudge()" placeholder="이 글을 한 문장으로">'+esc(r.sum)+'</textarea>'+
     '<div id="sumres" style="margin:10px 0">'+sumRes(hits,d,r.sum)+'</div>'+
     '<div class="lab">틀렸다면 — 왜 틀렸나</div>'+
     ["단어를 몰라서","문장 구조를 못 풀어서","글의 흐름을 놓쳐서","선택지를 잘못 읽어서","시간이 모자라서","찍었다"]
       .map(function(c){ return '<button class="ch'+(r.cause===c?" sel":"")+'" onclick="setCause(\''+c+'\')">'+c+'</button>'; }).join("")+
     '<button class="btn" onclick="finish()">정리 끝내기</button>'+
     (MANY?'<button class="btn ghost" onclick="listView()">목록으로</button>':'');
  return h;
}
function sumRes(hits,d,sum){
  if(!sum) return '<p class="sub">요약을 쓰면 핵심 요소가 몇 개 담겼는지 바로 세어 줍니다.</p>';
  var miss=d.rub.filter(function(_,i){return !hits[i];}).map(function(r){return r[0];});
  return '<div>'+hits.map(function(x){return '<span class="dot'+(x?" on":"")+'"></span>';}).join("")+
    ' <b>핵심 '+hits.filter(Boolean).length+'/'+d.rub.length+'</b></div>'+
    '<table style="margin-top:8px"><tr><th>핵심 요소</th><th>담겼나</th></tr>'+
    d.rub.map(function(row,i){return '<tr><td>'+row[0]+'</td><td>'+(hits[i]?"○":"—")+'</td></tr>';}).join("")+
    '</table>'+(miss.length?'<p class="sub">빠진 것: '+miss.join(", ")+'</p>':'<p class="sub" style="color:#166534">다 담겼습니다.</p>');
}
function reJudge(){
  var r=rec(cur.id); r.sum=document.getElementById("sum").value; save(ST);
  document.getElementById("sumres").innerHTML=sumRes(judge(r.sum,cur.rub),cur,r.sum);
}
function setCause(c){ var r=rec(cur.id); r.cause=(r.cause===c?"":c); save(ST); render(); }
function finish(){ var r=rec(cur.id); r.round=4; save(ST); if(MANY) listView(); else render(); }

/* ---------- 단어 누르기 ---------- */
function pick(n){
  var r=rec(cur.id);
  if(r.round===1) r.a1=n; else if(r.round===2) r.a2=n; else return;
  save(ST); render();
}
function bindWords(){
  var r=cur?rec(cur.id):null; if(!r) return;
  document.querySelectorAll(".w").forEach(function(el){
    var w=el.dataset.w;
    if(r.unk.indexOf(w)>=0) el.classList.add(r.round===1?"unk":"look");
    el.onclick=function(){
      if(r.round===1){
        var i=r.unk.indexOf(w);
        if(i>=0){ r.unk.splice(i,1); } else { r.unk.push(w); }
        save(ST);
        document.querySelectorAll('.w[data-w="'+w+'"]').forEach(function(e2){ e2.classList.toggle("unk"); });
      }else{
        if(r.unk.indexOf(w)<0){ r.unk.push(w); save(ST); }
        showWord(w);
      }
    };
  });
  document.querySelectorAll("textarea[data-i]").forEach(function(t){
    t.onchange=function(){ rec(cur.id).trans[t.dataset.i]=t.value; save(ST); };
  });
}
function showWord(w){
  var e=cur.dic[w];
  document.getElementById("pe").textContent=w;
  document.getElementById("pp").textContent=e?(e.p||""):"";
  document.getElementById("pk").textContent=e?e.k:"이 지문 사전에 없는 단어입니다.";
  document.getElementById("psay").onclick=function(){ speak(w); };
  document.getElementById("pop").classList.add("on");
}
function closePop(){ document.getElementById("pop").classList.remove("on"); }

/* ---------- 시작 ---------- */
(function(){
  var h=location.hash.replace("#","");
  if(!MANY || (h && DATA.some(function(d){return d.id===h;}))) {
    cur = h ? DATA.filter(function(d){return d.id===h;})[0] : DATA[0];
    render();
  } else listView();
})();
</script>
</body></html>
